<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Guerra Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<style>
:root{--panel:rgba(12,18,26,.94);--line:#2a3644;--txt:#e9eff5;--mut:#8b9aab;--red:#e5484d;--blue:#4c9be0;--gold:#f2c443;--green:#46b37a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#08131c;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#top{position:fixed;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(#08131cf0,#08131c00);z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#top h1{font-family:Georgia,"Times New Roman",serif;font-size:18px;margin:0 6px 0 0;letter-spacing:.5px;white-space:nowrap}
#day{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;min-width:70px;white-space:nowrap}
@media (max-width:440px){#top h1{display:none}}
.sp{background:#1a2532;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 9px;font-size:13px;cursor:pointer}
.sp.on{background:#2f4a66;border-color:#4c79a8}
#top .grow{flex:1}
#cas{position:fixed;top:56px;left:12px;background:rgba(10,14,20,.9);border:1px solid #232d38;border-radius:10px;padding:10px 14px;z-index:4;min-width:190px;display:none}
#cas h3{margin:0 0 6px;font-size:13px;letter-spacing:4px;text-align:center;border-bottom:1px solid #333f4c;padding-bottom:6px}
.crow{display:flex;align-items:center;gap:10px;font-family:"Courier New",monospace;font-size:20px;font-weight:700;line-height:1.35}
.crow img{width:34px;height:22px;border:1px solid #0006}
.cwar{padding:4px 0;border-bottom:1px dashed #2c3743}
.cwar:last-child{border-bottom:0}
.cmode{font-size:10px;letter-spacing:1px;color:var(--mut);font-family:system-ui}
#panel{position:fixed;right:12px;top:56px;width:330px;max-height:calc(100% - 68px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;z-index:6;touch-action:pan-y}
#ptog{display:none}
#panel h2{margin:2px 0 6px;font-size:19px;display:flex;align-items:center;gap:8px}
#panel h2 img{width:36px;height:24px;border:1px solid #0007}
.tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:5px;background:#33414f}
.tag.you{background:var(--gold);color:#222}.tag.war{background:var(--red)}.tag.ally{background:var(--green)}.tag.dead{background:#555}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:6px 0}
.stats b{font-variant-numeric:tabular-nums;text-align:right}
.mut{color:var(--mut)}.small{font-size:12px}
.bar{height:6px;background:#26313d;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.list{font-size:12.5px;margin:4px 0}
.list span{display:inline-block;background:#1c2733;border-radius:5px;padding:2px 6px;margin:2px 3px 0 0}
.list span.m{background:#4a1c22}
#pact{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#pact button,.modal button,.req button{font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#1b2734;color:var(--txt);cursor:pointer;text-align:left}
#pact button:hover:not(:disabled){background:#243446}
#pact button:disabled{opacity:.45;cursor:default}
#pact button.big{background:#2c5b3f;border-color:#3f8a5d;font-weight:700;text-align:center;font-size:16px}
#pact button.danger{background:#5a1f25;border-color:#8b2f38}
#pact button.dark{background:#2b0c10;border-color:#7a1520;font-weight:700}
#pact button.peace{background:#1e3f55;border-color:#2f6a8e}
#pact .row{display:flex;gap:6px;align-items:center}
#pact .row>*{flex:1}
#pact select{font:inherit;background:#1b2734;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
#log{margin-top:8px;font-size:12px;color:var(--mut);max-height:120px;overflow:hidden}
#log div{padding:1px 0}
#reqs{position:fixed;left:12px;bottom:96px;width:320px;display:flex;flex-direction:column;gap:6px;z-index:7}
.req{background:rgba(18,26,36,.97);border:1px solid #4c79a8;border-radius:10px;padding:10px 12px;font-size:14px;animation:pop .2s}
.req .b{display:flex;gap:6px;margin-top:8px}
.req button{flex:1;text-align:center;padding:7px}
.req button.y{background:#2c5b3f;border-color:#3f8a5d}
#toasts{position:fixed;top:54px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:8;pointer-events:none;width:min(92vw,460px)}
.toast{background:rgba(10,14,20,.93);border:1px solid #39475a;border-radius:8px;padding:7px 12px;font-size:13.5px;animation:pop .2s;text-align:center}
.toast.bad{border-color:var(--red)}.toast.good{border-color:var(--green)}.toast.g{color:var(--mut);font-size:12px}
[hidden]{display:none!important}
#vs{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(94vw,500px);background:rgba(10,14,20,.97);border:1px solid #6a2830;border-radius:14px;padding:14px 16px 10px;z-index:9;cursor:pointer;animation:vsin .35s ease-out;box-shadow:0 10px 40px #000a}
#vs .t{text-align:center;font-size:12px;letter-spacing:4px;color:#ff6b6b;font-weight:800;margin-bottom:10px}
#vs .s{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
#vs .side{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
#vs .side img{width:66px;height:44px;border:1px solid #000}
#vs .nm{font-weight:800;font-size:16px;text-align:center;overflow-wrap:anywhere}
#vs .pc{font-size:12px;font-weight:700;color:#7fdca6;text-align:center}
#vs .pc.e{color:#ff8a8a}
#vs .x{font-family:Georgia,serif;font-size:28px;font-weight:900;color:#ff5d6c}
#vs .bars{margin-top:12px;display:flex;flex-direction:column;gap:7px}
#vs .bl{display:grid;grid-template-columns:30px 1fr 44px;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
#vs .bl img{width:30px;height:20px;border:1px solid #000}
#vs .tr{height:12px;background:#1d2733;border-radius:6px;overflow:hidden}
#vs .tr i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
#vs .ft{font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
@keyframes vsin{from{transform:translate(-50%,-16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.cch{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin-top:3px}
.cch .tr2{height:6px;background:#4a1c22;border-radius:3px;overflow:hidden}
.cch .tr2 i{display:block;height:100%;background:var(--green)}
.cch b{color:var(--txt);font-variant-numeric:tabular-nums}
#air{position:fixed;left:calc(92px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;background:radial-gradient(#173a5a,#0a1622);border:2px solid #6fb6ff;color:#cfe6ff;font-size:24px;line-height:1;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 4px 18px #000a;font-family:inherit}
#air small{font-size:9.5px;font-weight:800;letter-spacing:.3px}
#air.cd{border-color:#4a5563;color:#8b9aab;background:#161d26}
#air.armed{background:radial-gradient(#1f5fa0,#0a2440);border-color:#9fd0ff;color:#fff;animation:arm .7s infinite alternate}
#nuke{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;background:radial-gradient(#5a4600,#1c1500);border:2px solid var(--gold);color:var(--gold);font-size:26px;line-height:1;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 4px 18px #000a;font-family:inherit}
#nuke small{font-size:9.5px;font-weight:800;letter-spacing:.5px}
#nuke.cd{border-color:#4a5563;color:#8b9aab;background:#161d26}
#nuke.armed{background:radial-gradient(#b01818,#3a0505);border-color:#ff5050;color:#fff;animation:arm .7s infinite alternate}
@keyframes arm{to{box-shadow:0 0 28px #ff3030}}
#pact input{font:inherit;background:#1b2734;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.tag.nuc{background:#5a4600;color:var(--gold)}
#mtext .opt{display:flex;flex-direction:column;gap:9px;margin:10px 0 4px;text-align:left;color:var(--txt);font-size:14px}
#mtext .opt label{display:flex;gap:9px;align-items:center;cursor:pointer}
#mtext .opt input{accent-color:var(--gold);width:17px;height:17px;flex:none}
.ctr{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-top:3px;font-variant-numeric:tabular-nums}
.tr-up{color:#5fd39a;font-weight:700}.tr-dn{color:#ff7a7a;font-weight:700}.tr-eq{color:var(--gold);font-weight:700}
.spk{display:block;width:100%;height:24px;margin-top:4px;background:#0d141c;border-radius:4px}
.spk polyline{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.rk-sum{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;margin:4px 0 10px;color:var(--mut)}
.rk-sum b{color:var(--txt)}
.rk-wrap{max-height:52vh;overflow:auto}
.rk{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--txt);text-align:left;font-variant-numeric:tabular-nums}
.rk th{font-size:10px;letter-spacing:1px;color:var(--mut);font-weight:700;padding:4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#111a24}
.rk td{padding:5px 4px;border-bottom:1px solid #1c2631;white-space:nowrap}
.rk td:nth-child(n+3),.rk th:nth-child(n+3){text-align:right}
.rk img{width:20px;height:13px;vertical-align:-2px;border:1px solid #0008}
.rk tr.me td{background:#3a3210;color:#ffe28a}
.modal .box{max-height:90vh;overflow:auto;max-width:440px}
#money{font:inherit;font-size:13px;font-weight:700;color:var(--gold);background:#1f1a08;border:1px solid #5a4a12;border-radius:8px;padding:4px 9px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
#money small{font-size:11px;font-weight:600;margin-left:4px}
#money small.up{color:#5fd39a}#money small.dn{color:#ff7a7a}
.shop{background:#141f2a;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.shop-h{font-size:13px;font-weight:700}.shop-h .mut{font-weight:400;font-size:11px}
#pact .shop button{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;padding:7px 4px;font-weight:700;background:#1f3324;border-color:#335a3f}
#pact .shop button small{font-size:11px;font-weight:600;color:var(--gold)}
.econ{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.econ b{color:var(--txt);font-variant-numeric:tabular-nums}
@media (max-width:440px){#money{font-size:12px;padding:3px 6px}#money small{display:none}#day{font-size:11px;min-width:0}#top{gap:3px!important}#top .sp{padding:3px 5px;font-size:11px}#day.big{font-size:12px}}
.tabs{display:flex;gap:4px;background:#0f1720;border:1px solid var(--line);border-radius:10px;padding:3px}
#pact .tabs button{flex:1;text-align:center;padding:7px 2px;font-size:12.5px;border:0;background:transparent;color:var(--mut);font-weight:700}
#pact .tabs button.on{background:#243446;color:var(--txt)}
#pact button.tech{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px}
.tech .ti{font-size:20px;text-align:center}
.tech .tb{display:flex;flex-direction:column;gap:2px;min-width:0}
.tech .tb small{font-size:11px;color:var(--mut);line-height:1.3}
.tech .lv{font-size:11px;color:var(--gold);font-weight:700}
.tech .tc{font-weight:800;color:var(--gold);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:2px;margin-top:2px}.pips i{width:10px;height:4px;border-radius:2px;background:#2a3644}.pips i.on{background:var(--gold)}
.clk{background:#141f2a;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.clk-v{font-size:28px;font-weight:800;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.clk-v small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.stats b.tl{font-size:12px;letter-spacing:.5px}
#day.big{font-family:"Archivo Black",system-ui,sans-serif;font-size:21px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;letter-spacing:.5px}
#wartitle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none;text-align:center;font-family:"Archivo Black",system-ui,sans-serif;color:#fff;text-shadow:0 3px 0 #000,0 0 10px #000,2px 0 0 #000,-2px 0 0 #000;max-width:min(72vw,940px)}
#wartitle .wt1{font-size:clamp(16px,2.6vw,34px);line-height:1.05;letter-spacing:.5px;overflow-wrap:anywhere}
#wartitle .wt2{font-size:clamp(12px,1.9vw,26px);line-height:1.1;margin-top:2px}
@media (max-width:760px){#wartitle{left:auto;right:8px;transform:none;text-align:right;bottom:calc(43vh + 12px);max-width:calc(100vw - 150px)}#wartitle .wt1{font-size:14px}#wartitle .wt2{font-size:11px}#day.big{font-size:14px}}
.saves{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:6px}
.sv{background:#141f2a;border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.svm{display:flex;flex-direction:column;gap:2px;color:var(--txt);min-width:0}
.svm span{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.svm img{width:20px;height:13px;vertical-align:-2px;margin-right:5px;border:1px solid #0008}
.svb{display:flex;gap:6px}
.modal .svb button{flex:1;padding:7px 4px;font-size:13px}
.modal .svb button.del{flex:none;padding:7px 10px;color:#ff9a9a}
.modal .svb button.warn{background:#5a3a10;border-color:#a8741e;color:#ffd58a}
#pact button.cont{background:#24406a;border-color:#3d68a8;display:flex;flex-direction:column;align-items:center;gap:2px}
#pact button.cont small{font-size:11.5px;font-weight:600;color:#bcd6ff}
#intro{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at center,rgba(5,10,20,.82),rgba(0,0,0,.94));text-align:center;padding:0 16px}
#intro.go{animation:intro 2.6s ease forwards}
#intro .i1{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:clamp(30px,7vw,64px);color:#f4f7ff;letter-spacing:2px;text-shadow:0 0 18px #6aa8ff,0 3px 0 #0a1a3a}
#intro .i2{font-family:"Archivo Black",system-ui,sans-serif;font-size:clamp(22px,5vw,46px);color:#8fc4ff;text-shadow:0 0 16px #2f6fd6,0 3px 0 #000}
#intro .i3{font-family:Georgia,serif;font-size:clamp(14px,2.6vw,22px);color:#d6b8ff;text-shadow:0 0 12px #7a3fd6}
@keyframes intro{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}
.modal .box{background:#111a24;border:1px solid var(--line);border-radius:14px;padding:22px;max-width:460px;width:90%;text-align:center}
.modal h2{margin:0 0 8px;font-family:Georgia,serif}
.modal .b{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.modal button{text-align:center}
@media (max-width:760px){
  #top h1{font-size:15px}
  #top{padding:0 8px;gap:5px}
  .sp{padding:4px 7px;font-size:12px}
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:43vh;border-radius:14px 14px 0 0;padding-top:6px}
  #panel.min{max-height:62px;overflow:hidden}
  #ptog{display:block;margin:0 auto 4px;width:44px;height:5px;border-radius:3px;background:#55657a;border:0;padding:0;cursor:pointer}
  #cas{top:52px;left:8px;padding:6px 10px;min-width:0}
  .crow{font-size:15px}.crow img{width:26px;height:17px}
  #cas h3{font-size:11px;letter-spacing:3px}
  #reqs{left:auto;right:8px;width:58vw;top:52px;bottom:auto}
  .req{font-size:13px;padding:8px 10px}
  #toasts{top:auto;bottom:calc(43vh + 80px)}
  .toast{font-size:12.5px;padding:5px 10px}
  #nuke{bottom:calc(43vh + 12px);left:10px;width:58px;height:58px;font-size:22px}
  #panel.min~#nuke{bottom:74px}
  #air{bottom:calc(43vh + 12px);left:74px;width:58px;height:58px;font-size:20px}
  #panel.min~#air{bottom:74px}
}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="top">
  <h1>Guerra Global</h1>
  <span id="day"></span>
  <button id="money" hidden title="Seu tesouro — toque para comprar soldados"></button>
  <span class="grow"></span>
  <button class="sp" data-spd="0">⏸</button>
  <button class="sp on" data-spd="1">1x</button>
  <button class="sp" data-spd="2">2x</button>
  <button class="sp" data-spd="4">4x</button>
  <button class="sp" id="save" title="Salvar e carregar">💾</button>
  <button class="sp" id="rank" title="Ranking mundial">🏆</button>
  <button class="sp" id="cfg" title="Configurações">⚙</button>
  <button class="sp" id="newgame" title="Novo jogo">↺</button>
</div>
<div id="cas"></div>
<div id="toasts"></div>
<div id="vs" hidden></div>
<div id="panel"><button id="ptog" aria-label="Minimizar painel"></button><div id="pinfo"></div><div id="pact"></div><div id="log"></div></div>
<div id="reqs"></div>
<div id="wartitle" hidden></div>
<div id="intro" hidden></div>
<button id="nuke" hidden aria-label="Bomba nuclear"></button>
<button id="air" class="" hidden aria-label="Bombardeio aéreo"></button>
<datalist id="clist"></datalist>
<div class="modal" id="modal"><div class="box"><h2 id="mtitle"></h2><div id="mtext" class="mut"></div><div class="b" id="mbtns"></div></div></div>

<script src="world-data.js"></script>
<script>
'use strict';
// ---------- constantes de jogo ----------
const CFG = {
  GW: 200, GH: 120,          // grade do mapa (células)
  S: 4,                      // pixels por célula no buffer do mapa
  LAND: 0.45,                // fração de terra
  TPS: 6,                    // ticks (dias) por segundo em 1x
  TROOPS_PER_CELL: 110,      // tropas iniciais por célula
  MAX_PER_CELL: 150,         // capacidade de tropas por célula
  REGEN: 0.45,               // regeneração por célula/dia
  CAPTURE: 0.42,             // chance de captura em vitória terrestre
  CAPTURE_SEA: 0.16,         // chance de captura em travessia marítima
  FOCUS_BONUS: 1.35,         // bônus do foco de ataque do jogador
  FOCUS_RADIUS: 10,
  GRACE_DAYS: 90,            // dias iniciais sem IA atacar o jogador
  RECRUIT_CD: 150, PEACE_CD: 25, ALLY_CD: 30, AID_CD: 10,
  TROOP_PRICE: 1,            // $ por soldado
  UPKEEP: .006,              // $ por soldado por dia
  GIFT: 2000,                // valor do presente em dinheiro
  NUKE_CD_MS: 30000,         // recarga da bomba nuclear do jogador (tempo real)
  AI_NUKE_CD_MS: 90000,      // recarga das potências nucleares da IA
  NUKE_R: 5, NUKE_FLY_MS: 1500, NUKE_FX_MS: 2600, RAD_DAYS: 80,
  RAID_COST: 4000, RAID_CD: 12, RAID_R: 3, BOMB_DAYS: 20, RAID_STRIKE_MS: 1100,  // bombardeio aéreo (custo $, recarga em dias)
};
let GW = CFG.GW, GH = CFG.GH, S = CFG.S, NC = GW * GH;
const $ = id => document.getElementById(id);
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));

function cleanComponents(type, minSize) {
  const seen = new Uint8Array(NC), stack = [], comp = [];

    stack.length = 0; comp.length = 0; stack.push(i); seen[i] = 1;
    let edge = false;
    while (stack.length) {
      const c = stack.pop(); comp.push(c);
      const x = c % GW, y = (c / GW) | 0;
      if (x === 0 || y === 0 || x === GW - 1 || y === GH - 1) edge = true;
      if (x > 0 && !seen[c - 1] && land[c - 1] === type) { seen[c - 1] = 1; stack.push(c - 1); }
      if (x < GW - 1 && !seen[c + 1] && land[c + 1] === type) { seen[c + 1] = 1; stack.push(c + 1); }
      if (y > 0 && !seen[c - GW] && land[c - GW] === type) { seen[c - GW] = 1; stack.push(c - GW); }

}

    g.addColorStop(0, `rgba(255,255,230,${a})`); g.addColorStop(.35, `rgba(255,200,70,${a * .95})`);
    g.addColorStop(.7, `rgba(230,80,20,${a * .7})`); g.addColorStop(1, 'rgba(120,20,10,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx1, sy1, fr, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(255,240,210,${(1 - e) * .85})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx1, sy1, R0 * (.5 + e * 2.6), 0, 7); ctx.stroke();
    const cy = sy1 - e * fr * 1.3, cr = fr * (.45 + e * .4);
    ctx.fillStyle = `rgba(90,70,60,${(1 - e) * .55})`; ctx.fillRect(sx1 - cr * .18, cy, cr * .36, sy1 - cy);
    const g2 = ctx.createRadialGradient(sx1, cy, 0, sx1, cy, cr);
    g2.addColorStop(0, `rgba(255,160,60,${(1 - e) * .8})`); g2.addColorStop(1, `rgba(80,60,55,0)`);
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(sx1, cy, cr, 0, 7); ctx.fill();
    if (e < .12) { ctx.fillStyle = `rgba(255,255,255,${(1 - e / .12) * .55})`; ctx.fillRect(0, 0, VW, VH); }
  }

}
function nukeButton() {
  const b = $('nuke'), show = phase === 'game' && P >= 0 && C[P].alive && warsOf(P).length > 0;
  b.hidden = !show; if (!show) { nukeArmed = false; return; }
  const left = Math.ceil((nukeReady - performance.now()) / 1000);
  const html = nukeArmed ? '☢<small>ALVO?</small>' : left > 0 ? `☢<small>${left}s</small>` : '☢<small>PRONTA</small>';
  b.className = nukeArmed ? 'armed' : left > 0 ? 'cd' : '';
  if (b.innerHTML !== html) b.innerHTML = html;
}
$('nuke').addEventListener('click', () => {
  if (performance.now() < nukeReady) { toast(`☢ Recarregando: ${Math.ceil((nukeReady - performance.now()) / 1000)}s`); return; }
  nukeArmed = !nukeArmed; if (nukeArmed) { airArmed = false; airButton(); }
  if (nukeArmed) toast('☢ Toque no território de um país em guerra com você.', 'bad');
  nukeButton();
});

// ---------- aviões e bombardeio aéreo ----------
function launchRaid(from, cell) {
  const A = C[from], e = owner[cell]; if (e < 0) return false;
  if (A.money < CFG.RAID_COST) { if (from === P) toast('💸 Dinheiro insuficiente para o bombardeio.', 'bad'); return false; }
  if (day < A.raidReady) { if (from === P) toast(`✈ Aviões reabastecendo: ${A.raidReady - day} dias.`); return false; }
  const tx = cell % GW, ty = (cell / GW) | 0;
  let src = A.cap, bd = 1e18;
  for (let i = 0; i < NC; i++) if (owner[i] === from) { const d = (i % GW - tx) ** 2 + (((i / GW) | 0) - ty) ** 2; if (d < bd) { bd = d; src = i; } }
  A.money -= CFG.RAID_COST; A.raidReady = day + CFG.RAID_CD;
  const E = C[e], pShot = clamp(.12 + .07 * (E.tech.air - A.tech.air) + .03 * E.tech.def, .02, .75);
  const planes = [0, 1, 2].map(i => ({ off: (i - 1) * 1.6, lag: Math.abs(i - 1) * .06, shot: R() < pShot }));
  const dist = Math.sqrt(bd), fly = clamp(700 + dist * 28, 900, 2800);
  const booms = Array.from({ length: 9 }, () => ({ dx: (R() - .5) * 2 * CFG.RAID_R, dy: (R() - .5) * 2 * CFG.RAID_R, d: R() * .8 }));
  raids.push({ from, to: e, src, dst: cell, t: performance.now(), fly, planes, booms, hit: false });
  if (from === P) toast(`✈ Esquadrilha decolou para bombardear ${E.name}!`, 'good');
  else if (e === P) toast(`✈ Aviões de ${A.name} estão vindo bombardear você!`, 'bad');
  return true;
}
function strikeRaid(r) {
  const A = C[r.from], E = C[r.to]; if (!E.alive) return;
  const alive = r.planes.filter(p => !p.shot).length, shot = 3 - alive;
  const tx = r.dst % GW, ty = (r.dst / GW) | 0, R2 = CFG.RAID_R;
  if (alive) for (let y = ty - R2; y <= ty + R2; y++) for (let x = tx - R2; x <= tx + R2; x++) {
    if (x < 0 || y < 0 || x >= GW || y >= GH || (x - tx) ** 2 + (y - ty) ** 2 > R2 * R2) continue;
    const c = y * GW + x; if (owner[c] === r.to) bomb[c] = Math.max(day, 1);
  }
  const loss = Math.min(E.troops * .3, E.troops * .035 * alive * (1 + .15 * A.tech.air) / (1 + .06 * E.tech.def));
  E.troops -= loss; E.casualties += loss; E.money = Math.max(0, E.money - 250 * alive);
  const w = warOf(r.from, r.to); if (w) { if (w.a === r.to) w.casA += loss; else w.casB += loss; }
  const sh = shot ? ` · ${shot} avião${shot > 1 ? 'ões' : ''} abatido${shot > 1 ? 's' : ''}` : '';
  if (r.from === P) toast(alive ? `💥 Bombardeio em ${E.name}: −${fmt(loss)} tropas${sh}` : `✈ Todos os aviões foram abatidos sobre ${E.name}!`, alive ? 'good' : 'bad');
  else if (r.to === P) toast(alive ? `💥 ${A.name} bombardeou você: −${fmt(loss)} tropas${sh}` : `🎯 Sua defesa antiaérea derrubou todos os aviões de ${A.name}!`, alive ? 'bad' : 'good');
  dirty = true;
}
function updateRaids(now) {
  for (const r of raids) if (!r.hit && now - r.t >= r.fly) { r.hit = true; strikeRaid(r); }
  raids = raids.filter(r => now - r.t < r.fly * 2 + CFG.RAID_STRIKE_MS);
}
function drawPlane(x, y, ang, col, sz, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha = alpha;
  ctx.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(sz, 0); ctx.lineTo(sz * .2, -sz * .12); ctx.lineTo(-sz * .1, -sz * .85); ctx.lineTo(-sz * .32, -sz * .85); ctx.lineTo(-sz * .22, -sz * .14);
  ctx.lineTo(-sz * .7, -sz * .12); ctx.lineTo(-sz * .85, -sz * .42); ctx.lineTo(-sz * .98, -sz * .42); ctx.lineTo(-sz * .92, 0);
  ctx.lineTo(-sz * .98, sz * .42); ctx.lineTo(-sz * .85, sz * .42); ctx.lineTo(-sz * .7, sz * .12); ctx.lineTo(-sz * .22, sz * .14);
  ctx.lineTo(-sz * .32, sz * .85); ctx.lineTo(-sz * .1, sz * .85); ctx.lineTo(sz * .2, sz * .12); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(200,230,255,.85)'; ctx.beginPath(); ctx.ellipse(sz * .45, 0, sz * .16, sz * .07, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function drawRaids(now, z) {
  const sz = clamp(z * 1.3, 8, 15);
  for (const r of raids) {
    const k = r.from === P ? C[r.from].col : C[r.from].col;
    const sx0 = cam.x + (r.src % GW + .5) * z, sy0 = cam.y + (((r.src / GW) | 0) + .5) * z;
    const sx1 = cam.x + (r.dst % GW + .5) * z, sy1 = cam.y + (((r.dst / GW) | 0) + .5) * z;
    const el = now - r.t, dx = sx1 - sx0, dy = sy1 - sy0, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, ang = Math.atan2(dy, dx);
    // alvo marcado durante a ida
    if (el < r.fly) {
      const pul = .5 + .5 * Math.sin(now / 100);
      ctx.strokeStyle = `rgba(255,200,60,${.4 + pul * .4})`; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(sx1, sy1, CFG.RAID_R * z, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    // explosões do bombardeio
    const se = el - r.fly;
    if (se >= 0 && se < CFG.RAID_STRIKE_MS && r.planes.some(p => !p.shot)) {
      for (const b of r.booms) {
        const t = se / CFG.RAID_STRIKE_MS - b.d * .5; if (t < 0 || t > .5) continue;
        const a = 1 - t / .5, bx = sx1 + b.dx * z, by = sy1 + b.dy * z, rr = z * (.5 + t * 2.2);
        const g = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
        g.addColorStop(0, `rgba(255,250,210,${a})`); g.addColorStop(.5, `rgba(255,150,40,${a * .85})`); g.addColorStop(1, 'rgba(90,40,20,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, rr, 0, 7); ctx.fill();
      }
    }
    for (const p of r.planes) {
      let f, back = false;
      const e2 = el / r.fly - p.lag;
      if (e2 < 1) f = Math.max(0, e2);
      else if (el < r.fly + CFG.RAID_STRIKE_MS * .4) f = 1 + (el - r.fly) / r.fly * .4;   // passa do alvo
      else { back = true; f = 1 - (el - r.fly - CFG.RAID_STRIKE_MS * .4) / r.fly; }
      if (p.shot && e2 > .85) {
        // abatido: cai girando com fumaça
        const fall = (el - r.fly * (.85 + p.lag)) / 900; if (fall > 1) continue;
        const bx = sx0 + ux * L * .85 - uy * p.off * sz + fall * sz, by = sy0 + uy * L * .85 + ux * p.off * sz + fall * sz * 2;
        ctx.fillStyle = `rgba(60,60,60,${(1 - fall) * .6})`; ctx.beginPath(); ctx.arc(bx - sz, by - sz, sz * (.4 + fall), 0, 7); ctx.fill();
        drawPlane(bx, by, ang + fall * 8, [90, 40, 30], sz * (1 - fall * .5), 1 - fall);
        if (fall < .3) { ctx.fillStyle = `rgba(255,140,40,${1 - fall / .3})`; ctx.beginPath(); ctx.arc(bx, by, sz * .6, 0, 7); ctx.fill(); }
        continue;
      }
      if (f < 0 || (back && f < 0)) continue;
      const ff = clamp(f, -1, 1.5);
      const px = sx0 + ux * L * ff - uy * p.off * sz, py = sy0 + uy * L * ff + ux * p.off * sz;
      const a2 = back ? ang + Math.PI : ang;
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.cos(a2) * sz * 2.6, py - Math.sin(a2) * sz * 2.6); ctx.stroke();
      drawPlane(px, py, a2, k, sz, 1);
      // flak perto do alvo
      if (!back && ff > .7 && ff < 1.1 && R() < .25) { ctx.fillStyle = 'rgba(220,220,220,.55)'; ctx.beginPath(); ctx.arc(px + (R() - .5) * sz * 3, py + (R() - .5) * sz * 3, sz * .3, 0, 7); ctx.fill(); }
    }
  }
}
function airButton() {
  const b = $('air'), show = phase === 'game' && P >= 0 && C[P].alive && warsOf(P).length > 0;
  b.hidden = !show; if (!show) { airArmed = false; return; }
  const left = C[P].raidReady - day, poor = C[P].money < CFG.RAID_COST;
  const html = airArmed ? '✈<small>ALVO?</small>' : left > 0 ? `✈<small>${left}d</small>` : `✈<small>${fmtM(CFG.RAID_COST)}</small>`;
  b.className = airArmed ? 'armed' : left > 0 || poor ? 'cd' : '';
  if (b.innerHTML !== html) b.innerHTML = html;
}
$('air').addEventListener('click', () => {
  if (day < C[P].raidReady) { toast(`✈ Aviões reabastecendo: ${C[P].raidReady - day} dias.`); return; }
  if (C[P].money < CFG.RAID_COST) { toast(`💸 O bombardeio custa ${fmtM(CFG.RAID_COST)}.`, 'bad'); return; }
  airArmed = !airArmed; if (airArmed) { nukeArmed = false; nukeButton(); toast('✈ Toque no território inimigo para bombardear.'); }
  airButton();
});

// ---------- entrada: arrastar, zoom, toque ----------
const ptrs = new Map(); let moved = 0, pinch0 = null;
function zoomAt(mx, my, f) {
  const nz = clamp(cam.z * f, cam.fit * .7, cam.fit * (worldMode === 'real' ? 16 : 9));
  cam.x = mx - (mx - cam.x) * nz / cam.z; cam.y = my - (my - cam.y) * nz / cam.z; cam.z = nz;
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = ptrs.size > 1 ? 99 : 0; pinch0 = null; });
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 6) { cam.x += dx; cam.y += dy; }
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d0 = Math.hypot(a.x - b.x, a.y - b.y);
    p.x = e.clientX; p.y = e.clientY;
    const [a2, b2] = [...ptrs.values()];
    const d1 = Math.hypot(a2.x - b2.x, a2.y - b2.y), mx = (a2.x + b2.x) / 2, my = (a2.y + b2.y) / 2;
    if (pinch0) { cam.x += mx - pinch0.x; cam.y += my - pinch0.y; }
    pinch0 = { x: mx, y: my };
    if (d0 > 0) zoomAt(mx, my, d1 / d0);
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
});
const endPtr = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0 && moved <= 6 && e.type === 'pointerup') tap(e.clientX, e.clientY);
  pinch0 = null;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
function tap(px, py) {
  const x = Math.floor((px - cam.x) / cam.z), y = Math.floor((py - cam.y) / cam.z);
  if (x < 0 || y < 0 || x >= GW || y >= GH) return;
  const c = y * GW + x, o = owner[c];
  if (airArmed) {
    if (o >= 0 && P >= 0 && warMat[P * N + o] >= 0) { airArmed = false; launchRaid(P, c); airButton(); }
    else toast('✈ Escolha um país que está em guerra com você.', 'bad');
    return;
  }
  if (nukeArmed) {
    if (o >= 0 && P >= 0 && warMat[P * N + o] >= 0) { nukeArmed = false; launchNuke(P, c); nukeButton(); }
    else toast('☢ Escolha um país que está em guerra com você.', 'bad');
    return;
  }
  if (phase === 'game' && P >= 0 && o === P && C[P].alive) {
    const v = clickVal(C[P]); C[P].money += v; C[P].clickTotal += v;
    if (floaters.length < 40) floaters.push({ x: px, y: py, t: performance.now(), text: '+' + fmtM(v) });
  }
  if (o < 0) { sel = phase === 'game' ? P : -1; }
  else {
    sel = o;
    if (phase === 'game' && P >= 0 && warMat[P * N + o] >= 0) focus = { c, enemy: o };
  }
  $('panel').classList.remove('min');
  dirty = true; updateUI();
}
addEventListener('resize', () => { resize(); });
addEventListener('keydown', e => {
  if (e.key === ' ') { const b = document.querySelector(`[data-spd="${speed ? 0 : 1}"]`); b && b.click(); }
});

// ---------- loop ----------
let shakeAmt = 0;
let acc = 0, lastT = performance.now(), uiT = 0, lastRO = 0;
function frame(t) {
  const dt = Math.min(250, t - lastT); lastT = t;
  if (phase === 'game' && speed > 0 && !ended) {
    acc += dt * CFG.TPS * speed / 1000;
    let n = 0;
    while (acc >= 1 && n < 12) { tick(); acc -= 1; n++; }
    if (n >= 12) acc = 0;
  } else if (phase === 'game' && ended && speed > 0 && P >= 0 && C[P].alive) {
    acc += dt * CFG.TPS * speed / 1000; while (acc >= 1) { tick(); acc -= 1; }
  }
  if (dirty && t - lastRO > 60) { renderOff(); dirty = false; lastRO = t; }
  if (phase === 'game' && P >= 0 && C[P].alive && !ended && t - lastAuto > 120000) { lastAuto = t; if (lastAuto > 1000) saveGame('auto', true); }
  updateNukes(t); updateRaids(t);
  draw();
  uiT += dt; if (uiT > 250) { uiT = 0; updateUI(); nukeButton(); airButton(); }
  requestAnimationFrame(frame);
}
resize();
newWorld();
updateUI();
requestAnimationFrame(frame);
</script>
