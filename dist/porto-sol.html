<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b12">
<title>Porto Sol</title>
<style>
  :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b12; touch-action: none; font-family: "Arial Black", Arial, sans-serif; color: #fff; }
  canvas { display: block; position: fixed; inset: 0; }
  .hidden { display: none !important; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #joyZone { position: absolute; left: 0; bottom: 0; width: 45%; height: 70%; pointer-events: auto; touch-action: none; }
  #joyBase { position: absolute; left: calc(40px + var(--sl)); bottom: 40px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.25); opacity: .55; transition: opacity .15s; }
  #joyBase.on { opacity: 1; bottom: auto; }
  #joyKnob { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 0 12px rgba(0,0,0,.5); }
  #btns { position: absolute; right: calc(18px + var(--sr)); bottom: calc(18px + var(--sb)); width: 230px; height: 220px; pointer-events: none; }
  .btn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 3px solid rgba(255,255,255,.45); color: #fff; font-family: inherit; font-size: 12px; letter-spacing: .5px; background: rgba(20,20,30,.45); text-shadow: 0 1px 2px #000; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0; }
  .btn.down { background: rgba(255,255,255,.35); transform: scale(.94); }
  #bFire { right: 0; bottom: 0; width: 96px; height: 96px; font-size: 14px; border-color: rgba(255,90,70,.8); background: rgba(150,30,20,.4); }
  #bRun { right: 108px; bottom: 6px; width: 76px; height: 76px; font-size: 11px; }
  #bEnter { right: 22px; bottom: 112px; width: 72px; height: 72px; border-color: rgba(255,210,60,.8); }
  #bEnter.glow { background: rgba(200,150,20,.55); box-shadow: 0 0 16px rgba(255,210,60,.6); }
  #bWeap { right: 120px; bottom: 98px; width: 60px; height: 60px; font-size: 16px; }
  #bWeap small { font-size: 8px; opacity: .8; }
  #bPause { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); pointer-events: auto; width: 44px; height: 34px; border-radius: 8px; border: 2px solid rgba(255,255,255,.4); background: rgba(0,0,0,.4); color: #fff; font-family: inherit; font-size: 14px; }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
  #title { background: radial-gradient(ellipse at 50% 120%, #ff7a2a 0%, #c8325a 30%, #3a1a5a 60%, #0b0b12 100%); overflow: hidden; }
  #title .sun { position: absolute; width: 60vmin; height: 60vmin; border-radius: 50%; bottom: -22vmin; left: 50%; transform: translateX(-50%); background: linear-gradient(#ffe25a, #ff6a2a); box-shadow: 0 0 80px #ff8a3a; }
  #title .sun::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-linear-gradient(transparent 0 14px, #c8325a 14px 18px); mask: linear-gradient(transparent 45%, #000 46%); -webkit-mask: linear-gradient(transparent 45%, #000 46%); }
  #title .city { position: absolute; bottom: 0; left: 0; right: 0; height: 28vh; background:
    linear-gradient(#0b0b12,#0b0b12) 5% 100%/6% 70% no-repeat, linear-gradient(#0b0b12,#0b0b12) 12% 100%/5% 45% no-repeat,
    linear-gradient(#0b0b12,#0b0b12) 20% 100%/7% 90% no-repeat, linear-gradient(#0b0b12,#0b0b12) 30% 100%/4% 55% no-repeat,
    linear-gradient(#0b0b12,#0b0b12) 68% 100%/6% 80% no-repeat, linear-gradient(#0b0b12,#0b0b12) 76% 100%/8% 60% no-repeat,
    linear-gradient(#0b0b12,#0b0b12) 86% 100%/5% 95% no-repeat, linear-gradient(#0b0b12,#0b0b12) 94% 100%/6% 50% no-repeat,
    linear-gradient(transparent 85%, #0b0b12 85%); }
  #title h1 { position: relative; margin: 0; font-size: min(18vw, 22vh); line-height: .9; letter-spacing: -2px; color: #ffe25a; text-shadow: 4px 4px 0 #c8325a, 8px 8px 0 #000; transform: rotate(-4deg); font-style: italic; }
  #title h2 { position: relative; margin: 6px 0 22px; font-size: min(4.5vw, 5vh); letter-spacing: 6px; color: #fff; text-shadow: 2px 2px 0 #000; }
  .menuBtn { position: relative; pointer-events: auto; font-family: inherit; font-size: 18px; color: #111; background: #ffe25a; border: 0; border-radius: 10px; padding: 12px 34px; margin: 6px; box-shadow: 0 5px 0 #b3881a, 0 8px 18px rgba(0,0,0,.5); min-width: 220px; }
  .menuBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b3881a; }
  .menuBtn.alt { background: #fff; box-shadow: 0 5px 0 #999, 0 8px 18px rgba(0,0,0,.5); }
  .help { position: relative; margin-top: 16px; font-family: Arial, sans-serif; font-weight: 700; font-size: 12px; opacity: .85; text-align: center; text-shadow: 1px 1px 0 #000; max-width: 90vw; }
  #dialog, #pause { background: rgba(0,0,0,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card { width: min(480px, 92vw); max-height: 92vh; overflow: auto; background: linear-gradient(#1c1c28, #12121a); border: 3px solid #ffe25a; border-radius: 14px; padding: 18px 20px; box-shadow: 0 10px 40px #000; text-align: center; }
  .card h2 { margin: 0 0 8px; color: #ffe25a; font-size: 22px; text-shadow: 2px 2px 0 #000; }
  .card p { font-family: Arial, sans-serif; font-weight: 700; line-height: 1.4; font-size: 14px; margin: 6px 0; }
  #dReward { color: #5dd35d; }
  .card .menuBtn { min-width: 140px; font-size: 15px; padding: 10px 20px; }
  #dNo:empty { display: none; }
  .shopItem { display: flex; justify-content: space-between; width: 100%; margin: 5px 0; padding: 10px 14px; border-radius: 8px; border: 2px solid #444; background: #22222e; color: #fff; font-family: inherit; font-size: 13px; }
  .shopItem b { color: #5dd35d; }
  .shopItem.no { border-color: #f44; background: #4a1a1a; }
  #rotate { display: none; }
  @keyframes fade { to { opacity: 0; } }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; position: fixed; top: 46%; animation: fade 1s 6s forwards; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: 6px 12px; border-radius: 8px; font-size: 11px; z-index: 5; pointer-events: none; white-space: nowrap; }
    #btns { transform: scale(.85); transform-origin: right bottom; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" class="hidden">
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="btns">
    <button class="btn" id="bEnter" data-k="enter">ENTRAR</button>
    <button class="btn" id="bWeap" data-k="weap"><small>ARMA</small>✊</button>
    <button class="btn" id="bRun" data-k="run">CORRER</button>
    <button class="btn" id="bFire" data-k="fire">SOCO</button>
  </div>
  <button id="bPause">❚❚</button>
  <div id="rotate">↻ Gire o celular para jogar melhor</div>
</div>
<div id="title" class="screen">
  <div class="sun"></div><div class="city"></div>
  <h1>PORTO SOL</h1>
  <h2>CRIME • CARROS • CIDADE</h2>
  <button class="menuBtn hidden" id="bCont">CONTINUAR</button>
  <button class="menuBtn alt" id="bNew">NOVO JOGO</button>
  <div class="help">Celular: analógico à esquerda, botões à direita • PC: WASD, Espaço atira, F entra/sai, Shift corre/freia, Q troca arma</div>
</div>
<div id="dialog" class="screen hidden">
  <div class="card">
    <h2 id="dTitle"></h2>
    <p id="dText"></p>
    <p id="dReward"></p>
    <div id="dExtra"></div>
    <button class="menuBtn" id="dOk">COMEÇAR</button>
    <button class="menuBtn alt" id="dNo">AGORA NÃO</button>
  </div>
</div>
<div id="pause" class="screen hidden">
  <div class="card">
    <h2>PAUSADO</h2>
    <button class="menuBtn" id="pResume">CONTINUAR</button><br>
    <button class="menuBtn alt" id="pSound">SOM: LIGADO</button><br>
    <button class="menuBtn alt" id="pFull">TELA CHEIA</button><br>
    <button class="menuBtn alt" id="pMenu">SALVAR E SAIR</button>
  </div>
</div>
<script>
'use strict';
// ===== Constantes do mundo =====
const T = 32;              // tamanho do tile em px
const P = 14;              // período do quarteirão em tiles (4 rua + 10 lote)
const RW = 4;              // largura da rua em tiles
const NB = 9;              // quarteirões por eixo
const PT = P * T, RWP = RW * T;
const CITY_T = NB * P + RW;
const MAP_TW = CITY_T + 16, MAP_TH = CITY_T;
const WW = MAP_TW * T, WH = MAP_TH * T;
const WATER_X = (CITY_T + 5) * T;
const TILE = { ROAD: 0, WALK: 1, GRASS: 2, LOT: 3, SAND: 4, WATER: 5, PATH: 6 };

// ===== Utilidades =====
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angN = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * f) | 0, g = Math.min(255, ((n >> 8) & 255) * f) | 0, b = Math.min(255, (n & 255) * f) | 0;
  return `rgb(${r},${g},${b})`;
}

// ===== Distritos e locais especiais =====
const PARKS = new Set(['1,1', '6,4', '4,7', '7,7', '0,4']);
const SPECIAL = {
  safe: { bx: 3, by: 6, label: 'CASA', col: '#c98b5a', roof: '#8a3b2a', ht: 42 },
  hospital: { bx: 5, by: 3, label: 'HOSPITAL', col: '#e8e8e8', roof: '#f4f4f4', ht: 90 },
  police: { bx: 3, by: 3, label: 'POLÍCIA', col: '#5a6f9a', roof: '#3b4a6b', ht: 80 },
  bank: { bx: 4, by: 4, label: 'BANCO', col: '#c9b27a', roof: '#a8925c', ht: 210 },
  guns: { bx: 2, by: 4, label: 'ARMAS', col: '#6b5a48', roof: '#3d342a', ht: 40 },
  paint: { bx: 6, by: 6, label: 'PINTURA', col: '#4f9a8a', roof: '#2f6b60', ht: 45 },
  garage: { bx: 7, by: 2, label: 'OFICINA', col: '#9a8a6a', roof: '#6b6050', ht: 55 },
  dock: { bx: 1, by: 7, label: 'GALPÃO', col: '#7a6a5a', roof: '#5a4a3a', ht: 60 },
};
const SPECIAL_BY_BLOCK = {};
for (const k in SPECIAL) { const s = SPECIAL[k]; s.key = k; SPECIAL_BY_BLOCK[s.bx + ',' + s.by] = s; }

function districtOf(bx, by) {
  if (PARKS.has(bx + ',' + by)) return 'park';
  if (bx === NB - 1) return 'beach';
  if (bx <= 2 && by >= 6) return 'industrial';
  if (Math.abs(bx - 4) <= 1 && Math.abs(by - 4) <= 1) return 'downtown';
  return 'suburb';
}
const lotX = bx => bx * PT + RWP + T;   // início do interior do lote
const lotY = by => by * PT + RWP + T;
const LOT = 8 * T;                      // 256
// posição do marcador na calçada em frente ao local
function spotOf(key) {
  const s = SPECIAL[key];
  if (key === 'paint') return { x: lotX(s.bx) + 128, y: lotY(s.by) + 185 };
  return { x: lotX(s.bx) + 128, y: s.by * PT + 13 * T + 16 };
}

// ===== Geração =====
const tiles = new Uint8Array(MAP_TW * MAP_TH);
const tileAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= MAP_TW || ty >= MAP_TH) ? TILE.WATER : tiles[ty * MAP_TW + tx];
const BUILDINGS = [];
const TREES = [];
const DECOS = [];  // decorações no chão: piscinas, vagas, fontes
const BLOCK_OBS = []; // obstáculos por quarteirão
for (let i = 0; i < (NB + 2) * (NB + 2); i++) BLOCK_OBS.push([]);
const blockIdx = (bx, by) => (bx < 0 || by < 0 || bx > NB || by > NB) ? -1 : bx + by * (NB + 1);

function genWorld() {
  for (let ty = 0; ty < MAP_TH; ty++) for (let tx = 0; tx < MAP_TW; tx++) {
    let t;
    if (tx >= CITY_T) t = tx < CITY_T + 5 ? TILE.SAND : TILE.WATER;
    else {
      const mx = tx % P, my = ty % P;
      if (mx < 4 || my < 4) t = TILE.ROAD;
      else if (mx === 4 || mx === 13 || my === 4 || my === 13) t = TILE.WALK;
      else {
        const bx = Math.floor(tx / P), by = Math.floor(ty / P);
        const d = districtOf(bx, by);
        const sp = SPECIAL_BY_BLOCK[bx + ',' + by];
        if (sp) t = TILE.LOT;
        else if (d === 'park') t = (mx === 8 || my === 8 || mx === 9 || my === 9) ? TILE.PATH : TILE.GRASS;
        else if (d === 'suburb') t = TILE.GRASS;
        else if (d === 'beach') t = TILE.SAND;
        else t = TILE.LOT;
      }
    }
    tiles[ty * MAP_TW + tx] = t;
  }
  for (let by = 0; by < NB; by++) for (let bx = 0; bx < NB; bx++) genBlock(bx, by);
  // palmeiras na praia
  const r = rng(999);
  for (let y = 40; y < WH - 40; y += 90 + r() * 120) {
    TREES.push({ x: (CITY_T + 1) * T + r() * 3 * T, y, r: 16, palm: true });
  }
  for (const t of TREES) addObs({ type: 'c', x: t.x, y: t.y, r: 8 });
}
function addObs(o) {
  const x = o.type === 'c' ? o.x : o.x + o.w / 2, y = o.type === 'c' ? o.y : o.y + o.h / 2;
  const i = blockIdx(Math.floor(x / PT), Math.floor(y / PT));
  if (i >= 0) BLOCK_OBS[i].push(o);
}
function addB(x, y, w, h, ht, col, roof, label) {
  const b = { type: 'r', x, y, w, h, ht, col, roof, label, details: [] };
  const r = Math.random;
  const n = label ? 1 : Math.floor(r() * 3);
  for (let i = 0; i < n; i++) {
    const dw = 10 + r() * 14, dh = 8 + r() * 10;
    b.details.push({ x: x + 8 + r() * (w - dw - 16), y: y + 8 + r() * (h - dh - 16), w: dw, h: dh });
  }
  BUILDINGS.push(b); addObs(b);
  return b;
}
function genBlock(bx, by) {
  const r = rng(bx * 131 + by * 7919 + 17);
  const x0 = lotX(bx), y0 = lotY(by);
  const sp = SPECIAL_BY_BLOCK[bx + ',' + by];
  const d = districtOf(bx, by);
  if (sp) {
    if (sp.key === 'paint') {
      addB(x0 + 6, y0 + 6, 244, 110, sp.ht, sp.col, sp.roof, sp.label);
      DECOS.push({ type: 'stripe', x: x0 + 40, y: y0 + 130, w: 176, h: 110 });
    } else if (sp.key === 'safe') {
      addB(x0 + 40, y0 + 30, 170, 130, sp.ht, sp.col, sp.roof, sp.label);
      DECOS.push({ type: 'pool', x: x0 + 150, y: y0 + 175, w: 80, h: 50 });
      TREES.push({ x: x0 + 30, y: y0 + 200, r: 18 });
    } else if (sp.key === 'bank' || sp.key === 'hospital' || sp.key === 'police') {
      addB(x0 + 20, y0 + 16, 216, 170, sp.ht, sp.col, sp.roof, sp.label);
      DECOS.push({ type: 'park', x: x0 + 20, y: y0 + 200, w: 216, h: 46 });
    } else {
      addB(x0 + 24, y0 + 20, 208, 150, sp.ht, sp.col, sp.roof, sp.label);
      DECOS.push({ type: 'park', x: x0 + 24, y: y0 + 190, w: 208, h: 50 });
    }
    return;
  }
  if (d === 'park') {
    const n = 7 + Math.floor(r() * 6);
    for (let i = 0; i < n; i++) {
      const tx = x0 + 20 + r() * 216, ty = y0 + 20 + r() * 216;
      if (Math.abs(tx - (x0 + 128)) < 40 || Math.abs(ty - (y0 + 128)) < 40) continue;
      TREES.push({ x: tx, y: ty, r: 14 + r() * 10 });
    }
    DECOS.push({ type: 'fountain', x: x0 + 128, y: y0 + 128, w: 0, h: 0 });
    addObs({ type: 'c', x: x0 + 128, y: y0 + 128, r: 26 });
    return;
  }
  if (d === 'downtown') {
    const cols = ['#7d8fa3', '#8a8f99', '#5d7189', '#a3a39a', '#6a7d8a', '#8c7f73'];
    const lay = r();
    if (lay < 0.35) addB(x0 + 10, y0 + 10, 236, 236, 150 + r() * 120, pick(cols), shade(pick(cols), 0.8), null);
    else if (lay < 0.7) {
      addB(x0 + 8, y0 + 8, 112, 240, 110 + r() * 130, pick(cols), shade(pick(cols), 0.8), null);
      addB(x0 + 136, y0 + 8, 112, 240, 110 + r() * 130, pick(cols), shade(pick(cols), 0.8), null);
    } else {
      for (let i = 0; i < 4; i++) addB(x0 + 8 + (i % 2) * 128, y0 + 8 + (i >> 1) * 128, 112, 112, 80 + r() * 140, pick(cols), shade(pick(cols), 0.8), null);
    }
    return;
  }
  if (d === 'industrial') {
    const cols = ['#9a8f7a', '#7f8a8a', '#a0927a'];
    addB(x0 + 10, y0 + 12, 236, 120, 50 + r() * 25, pick(cols), '#6f6f6a', null);
    addB(x0 + 10, y0 + 150, 120, 96, 40 + r() * 20, pick(cols), '#7a6f60', null);
    DECOS.push({ type: 'park', x: x0 + 140, y: y0 + 150, w: 106, h: 96 });
    return;
  }
  // subúrbio / praia: casas
  const wallC = d === 'beach' ? ['#f2c6a0', '#a8e0e0', '#f5e08a', '#f0a8c0', '#ffffff'] : ['#d9c7a6', '#c9a98a', '#e6dccb', '#b8a48a', '#d6b38f'];
  const roofC = d === 'beach' ? ['#2a8f9a', '#d9583a', '#3a6fd9', '#e08a2a'] : ['#8a3b2a', '#6b4a3a', '#5a5a6a', '#9a4a3a', '#4a5a3a'];
  for (let i = 0; i < 4; i++) {
    const qx = x0 + (i % 2) * 128, qy = y0 + (i >> 1) * 128;
    if (r() < 0.15) { TREES.push({ x: qx + 64, y: qy + 64, r: 22 }); continue; }
    const w = 70 + r() * 30, h = 64 + r() * 30;
    const hx = qx + 14 + r() * (114 - w - 14), hy = qy + 14 + r() * (114 - h - 14);
    addB(hx, hy, w, h, 28 + r() * 18, pick(wallC), pick(roofC), null);
    if (r() < 0.3 && d === 'suburb') DECOS.push({ type: 'pool', x: qx + 10, y: qy + 98, w: 40, h: 24 });
    if (r() < 0.5) TREES.push({ x: qx + 110 + r() * 10, y: qy + 12 + r() * 100, r: 12 + r() * 6 });
  }
}

// ===== Colisão =====
function resolveCircle(o, r) {
  let nx = 0, ny = 0, hit = false;
  if (o.x < r) { o.x = r; nx += 1; hit = true; }
  if (o.y < r) { o.y = r; ny += 1; hit = true; }
  if (o.y > WH - r) { o.y = WH - r; ny -= 1; hit = true; }
  if (o.x > WATER_X - r) { o.x = WATER_X - r; nx -= 1; hit = true; }
  const bx = Math.floor(o.x / PT), by = Math.floor(o.y / PT);
  const i = blockIdx(bx, by);
  if (i < 0) return hit ? { nx, ny } : null;
  for (const b of BLOCK_OBS[i]) {
    if (b.type === 'r') {
      const cx = clamp(o.x, b.x, b.x + b.w), cy = clamp(o.y, b.y, b.y + b.h);
      let dx = o.x - cx, dy = o.y - cy;
      const d2 = dx * dx + dy * dy;
      if (d2 >= r * r) continue;
      if (d2 === 0) { // dentro do retângulo
        const l = o.x - b.x, rr = b.x + b.w - o.x, t = o.y - b.y, bt = b.y + b.h - o.y;
        const m = Math.min(l, rr, t, bt);
        if (m === l) { o.x = b.x - r; nx -= 1; } else if (m === rr) { o.x = b.x + b.w + r; nx += 1; }
        else if (m === t) { o.y = b.y - r; ny -= 1; } else { o.y = b.y + b.h + r; ny += 1; }
      } else {
        const d = Math.sqrt(d2); dx /= d; dy /= d;
        o.x = cx + dx * r; o.y = cy + dy * r; nx += dx; ny += dy;
      }
      hit = true;
    } else {
      let dx = o.x - b.x, dy = o.y - b.y; const d = Math.hypot(dx, dy), rr = r + b.r;
      if (d >= rr || d === 0) continue;

function findTarget(pl, range, facing) {
  let best = null, bs = 1e9;
  for (const p of G.peds) {
    if (p.hp <= 0 || p.car) continue;
    const d = dist(p, pl); if (d > range) continue;
    const ad = Math.abs(angN(Math.atan2(p.y - pl.y, p.x - pl.x) - facing));
    if (ad > 1.0) continue;
    const hostile = p.kind === 'gang' || (p.kind === 'cop' && G.wanted > 0) || p.state === 'attack';
    const sc = d + ad * 150 - (hostile ? 250 : 0);
    if (sc < bs && los(pl, p)) { bs = sc; best = p; }
  }
  for (const c of G.cars) {
    if (c.wreck || !c.police || !c.driver || c.driver === pl) continue;
    const d = dist(c, pl); if (d > range) continue;
    const ad = Math.abs(angN(Math.atan2(c.y - pl.y, c.x - pl.x) - facing)); if (ad > 0.8) continue;
    if (d + ad * 150 < bs) { bs = d + ad * 150; best = c; }
  }
  return best;
}

function carCarCollide(a, b) {

    const dx = ca[0] - cb[0], dy = ca[1] - cb[1], d = Math.hypot(dx, dy), m = ra + rb;
    if (d >= m || d === 0) continue;

    const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;

      const j = -vn * 0.6;
      if (a.ai) a.spd *= 0.4; else { a.vx += nx * j; a.vy += ny * j; }
      if (b.ai) b.spd *= 0.4; else { b.vx -= nx * j; b.vy -= ny * j; }
      if (-vn > 70) {

      }

  }
}

function drawNight(dk, v, z) {
