<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%230c0e13%22%2F%3E%0A%20%20%3Crect%20x%3D%22216%22%20y%3D%220%22%20width%3D%2280%22%20height%3D%22512%22%20fill%3D%22%23383b40%22%2F%3E%0A%20%20%3Crect%20x%3D%220%22%20y%3D%22216%22%20width%3D%22512%22%20height%3D%2280%22%20fill%3D%22%23383b40%22%2F%3E%0A%20%20%3Crect%20x%3D%22252%22%20y%3D%2220%22%20width%3D%228%22%20height%3D%2240%22%20fill%3D%22%23d6b23a%22%2F%3E%3Crect%20x%3D%22252%22%20y%3D%22452%22%20width%3D%228%22%20height%3D%2240%22%20fill%3D%22%23d6b23a%22%2F%3E%0A%20%20%3Cg%20transform%3D%22translate(256%20300)%20rotate(-35)%22%3E%0A%20%20%20%20%3Crect%20x%3D%22-34%22%20y%3D%22-62%22%20width%3D%2268%22%20height%3D%22124%22%20rx%3D%2216%22%20fill%3D%22%23ff8a2a%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%22-24%22%20y%3D%22-40%22%20width%3D%2248%22%20height%3D%2222%22%20rx%3D%226%22%20fill%3D%22%2322303c%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%22-24%22%20y%3D%2226%22%20width%3D%2248%22%20height%3D%2216%22%20rx%3D%225%22%20fill%3D%22%2322303c%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Ctext%20x%3D%22256%22%20y%3D%22140%22%20font-family%3D%22Arial%20Black%2C%20sans-serif%22%20font-size%3D%2292%22%20font-weight%3D%22900%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffd23a%22%3EPB%3C%2Ftext%3E%0A%3C%2Fsvg%3E%0A">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0e13;
  --panel: rgba(14, 17, 24, 0.82);
  --panel-solid: #141820;
  --line: rgba(255, 255, 255, 0.09);
  --text: #eef0f4;
  --muted: #9aa3b2;
  --accent: #ff8a2a;
  --accent2: #ffd23a;
  --ok: #4fd17a;
  --bad: #ff4f5e;
  --blue: #4fa3ff;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --tsize: 1;
  --topa: 0.75;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
.hidden { display: none !important; }
button { font-family: inherit; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.hud-tl { position: absolute; top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l)); display: flex; gap: 8px; align-items: flex-start; }
.hud-btn { pointer-events: auto; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  width: 40px; height: 40px; font-size: 14px; font-weight: 700; cursor: pointer; }
.hud-btn.small { width: auto; height: 28px; padding: 0 10px; font-size: 11px; letter-spacing: 1px; margin-top: 6px; }
.hud-btn:active { transform: scale(0.95); }
.stat-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 11px; min-width: 150px; backdrop-filter: blur(4px); }
.money { font-size: 22px; font-weight: 800; color: #7cf29a; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.money.bump { animation: bump 0.4s; }
@keyframes bump { 50% { transform: scale(1.15); } }
.hp-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.hp-icon { color: var(--bad); font-size: 13px; }
.bar { height: 7px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; flex: 1; }
#hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4f5e, #ff8a6a); transition: width .2s; }
.stars { margin-top: 4px; font-size: 18px; letter-spacing: 2px; height: 22px; }
.stars span { color: rgba(255,255,255,.14); }
.stars span.on { color: var(--accent2); text-shadow: 0 0 8px rgba(255,210,58,.6); }
.stars.blink span.on { animation: blink 0.6s infinite; }
.stars.flash { animation: flash 0.25s 4; }
@keyframes blink { 50% { opacity: .25; } }
@keyframes flash { 50% { transform: scale(1.25); } }

.hud-tr { position: absolute; top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r)); display: flex; flex-direction: column; align-items: flex-end; }
.minimap-wrap { position: relative; width: 160px; height: 160px; border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,.15); box-shadow: 0 6px 20px rgba(0,0,0,.45); background: #0d1218; }
#minimap { width: 100%; height: 100%; display: block; }
.clock { position: absolute; left: 6px; bottom: 5px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.district { margin-top: 5px; font-size: 11px; color: var(--muted); background: var(--panel); padding: 3px 8px; border-radius: 6px; letter-spacing: .5px; text-transform: uppercase; }

.mission-panel { position: absolute; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); width: min(420px, 46vw);
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent2); border-radius: 12px; padding: 7px 12px; }
.mp-head { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.mp-timer { font-size: 15px; font-weight: 800; color: var(--accent2); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.mp-timer.low { color: var(--bad); animation: blink .8s infinite; }
.mp-name { font-weight: 800; font-size: 15px; margin-top: 1px; }
.mp-obj { font-size: 13px; color: #d7dbe3; margin-top: 2px; }

.speedo { position: absolute; bottom: calc(14px + var(--safe-b)); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px 14px; text-align: center; min-width: 130px; }
.sp-name { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.sp-val { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.sp-unit { font-size: 11px; color: var(--muted); margin-left: 4px; }
.bar.dmg { height: 5px; margin-top: 3px; }
#sp-dmg { height: 100%; width: 100%; background: linear-gradient(90deg, #4fd17a, #ffd23a); }

.prompt { position: absolute; bottom: calc(92px + var(--safe-b)); left: 50%; transform: translateX(-50%); background: rgba(10,12,16,.88); border: 1px solid var(--accent);
  color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; pointer-events: auto; cursor: pointer; }
.prompt b { color: var(--accent); }
.hint { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 15px; }
.toasts { position: absolute; top: calc(120px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast { background: rgba(10,12,16,.9); border: 1px solid var(--line); padding: 7px 14px; border-radius: 9px; font-size: 14px; font-weight: 600; animation: toastIn .25s; white-space: nowrap; }
.toast.ok { border-color: var(--ok); }
.toast.warn { border-color: var(--bad); }
.toast.money { border-color: #7cf29a; color: #7cf29a; font-size: 17px; font-weight: 800; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }
.banner { position: absolute; top: 40%; left: 0; right: 0; text-align: center; pointer-events: none; }
.banner .b1 { font-size: 12px; letter-spacing: 4px; color: var(--accent2); text-transform: uppercase; }
.banner .b2 { font-size: clamp(26px, 5vw, 46px); font-weight: 900; text-shadow: 0 4px 0 rgba(0,0,0,.5); }
.banner.anim { animation: bannerA 3s forwards; }
@keyframes bannerA { 0% { opacity: 0; transform: scale(1.2); } 10%, 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.fps { position: absolute; bottom: 4px; left: 4px; font-size: 10px; color: #8f8; }

/* ---------- Touch ---------- */
#touch { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: var(--topa); }
#joy-zone { position: absolute; left: 0; bottom: 0; width: 45%; height: 70%; pointer-events: auto; touch-action: none; }
#joy-base { position: absolute; width: calc(130px * var(--tsize)); height: calc(130px * var(--tsize)); border-radius: 50%; left: calc(30px + var(--safe-l)); bottom: calc(30px + var(--safe-b));
  background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 2px solid rgba(255,255,255,.22); }
#joy-knob { position: absolute; width: 46%; height: 46%; left: 27%; top: 27%; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.5); }
#btns { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(18px + var(--safe-b)); display: grid; grid-template-columns: repeat(3, auto); gap: calc(10px * var(--tsize)); align-items: end; pointer-events: none; }
.tb { pointer-events: auto; touch-action: none; width: calc(72px * var(--tsize)); height: calc(72px * var(--tsize)); border-radius: 50%; border: 2px solid rgba(255,255,255,.3);
  background: rgba(20,24,32,.55); color: #fff; font-size: calc(10px * var(--tsize)); font-weight: 800; letter-spacing: .5px; }
.tb.tb-s { width: calc(56px * var(--tsize)); height: calc(56px * var(--tsize)); font-size: calc(8px * var(--tsize)); }
.tb.on { background: rgba(255,138,42,.55); border-color: var(--accent); transform: scale(.94); }
.tb-accel { background: rgba(40,140,70,.45); width: calc(84px * var(--tsize)); height: calc(84px * var(--tsize)); }
.tb-brake { background: rgba(170,40,50,.45); }
.tb-enter { background: rgba(40,90,170,.5); }
.tb-action.ready { border-color: var(--accent2); box-shadow: 0 0 12px rgba(255,210,58,.6); }
#touch.foot .foot-hide { display: none; }
#touch.car .car-hide { display: none; }
#touch.no-enter .tb-enter { visibility: hidden; }

/* ---------- Telas ---------- */
#screen { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(6,8,12,.72); backdrop-filter: blur(3px); }
#screen.show { display: flex; }
#screen.solid { background: radial-gradient(ellipse at 30% 20%, #1e2533 0%, #0b0d12 70%); }
.panel { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; width: min(760px, 94vw); max-height: 92vh; overflow: auto; padding: 22px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.panel.narrow { width: min(460px, 94vw); }
.panel h1 { margin: 0 0 4px; font-size: 26px; }
.panel h2 { margin: 0 0 12px; font-size: 20px; }
.panel h3 { margin: 16px 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
.panel p { color: #c9ced8; line-height: 1.5; margin: 6px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: 11px; border: 1px solid var(--line); background: #222836;
  color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; min-height: 46px; touch-action: manipulation; }
.btn:hover { background: #2a3142; }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, #ff9a3a, #e8701a); border-color: #ff9a3a; color: #1a0e02; }
.btn.danger { background: #3a1f24; border-color: #6a2a33; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.small { padding: 7px 12px; min-height: 34px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.col { display: flex; flex-direction: column; gap: 10px; }

.title-screen { text-align: center; padding: 20px; max-width: 520px; width: 94vw; }
.logo { font-size: clamp(44px, 10vw, 84px); font-weight: 900; letter-spacing: -2px; line-height: .9;
  background: linear-gradient(180deg, #ffd23a 0%, #ff8a2a 55%, #e2481f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 rgba(0,0,0,.4)); }
.logo-sub { letter-spacing: 8px; color: var(--muted); font-size: 13px; margin: 8px 0 28px; text-transform: uppercase; }
.title-screen .col .btn { width: 100%; }
.foot-note { margin-top: 18px; font-size: 11px; color: #6b7384; }

.chars { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
.char { border: 2px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; background: #181d27; }
.char.sel { border-color: var(--accent); background: #251c14; }
.char canvas { width: 110px; height: 110px; }
.char .cn { font-weight: 800; margin-top: 4px; }
.char .cp { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 30px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 8px 12px; border-radius: 9px; background: #1d2230; border: 1px solid var(--line); color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; }
.tab.on { background: #2b2216; color: var(--accent); border-color: var(--accent); }

.mlist { display: flex; flex-direction: column; gap: 8px; }
.mitem { display: flex; gap: 10px; align-items: center; background: #1a1f2a; border-radius: 10px; padding: 9px 12px; border-left: 4px solid #555; }
.mitem .mi-ic { font-size: 18px; width: 22px; text-align: center; }
.mitem .mi-t { flex: 1; }
.mitem .mi-n { font-weight: 700; }
.mitem .mi-d { font-size: 12px; color: var(--muted); }
.mitem .mi-s { font-size: 12px; font-weight: 700; }
.mitem.locked { opacity: .45; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.stat { background: #1a1f2a; border-radius: 10px; padding: 10px 12px; }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.stat .v { font-size: 20px; font-weight: 800; margin-top: 2px; }

.setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setting label { font-weight: 600; }
.setting select, .setting input[type=range] { background: #1d2230; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px; min-width: 140px; }
.setting input[type=checkbox] { width: 22px; height: 22px; }

.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.keys kbd { background: #252b39; border: 1px solid #3a4254; border-bottom-width: 3px; border-radius: 6px; padding: 2px 8px; font-family: inherit; font-weight: 700; font-size: 12px; white-space: nowrap; }

.map-canvas { width: 100%; max-width: 560px; aspect-ratio: 1; display: block; margin: 0 auto; border-radius: 12px; border: 1px solid var(--line); background: #0d1218; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; justify-content: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

.brief-cat { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
.brief-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; }
.brief-meta b { color: var(--accent2); }
.result-big { font-size: clamp(30px, 6vw, 44px); font-weight: 900; text-align: center; margin: 4px 0; }
.result-big.ok { color: var(--accent2); }
.result-big.bad { color: var(--bad); }
.reward { text-align: center; font-size: 30px; color: #7cf29a; font-weight: 900; }
.center { text-align: center; }

.garage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gcar { background: #1a1f2a; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid var(--line); }
.gcar canvas { width: 120px; height: 60px; }
.gcar .gn { font-weight: 800; }
.gcar .gd { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
.gcar.empty { opacity: .5; display: flex; align-items: center; justify-content: center; min-height: 120px; color: var(--muted); }

#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 30; transition: opacity .5s; display: flex; align-items: center; justify-content: center;
  font-size: clamp(34px, 8vw, 70px); font-weight: 900; letter-spacing: 2px; }
#fade.on { opacity: 1; }
#fade .wasted { color: var(--bad); text-shadow: 0 6px 0 rgba(0,0,0,.6); }
#fade .busted { color: var(--blue); text-shadow: 0 6px 0 rgba(0,0,0,.6); }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 40; font-size: 18px; color: var(--muted); }

.rotate-tip { font-size: 12px; color: var(--accent2); margin-top: 10px; }
@media (orientation: landscape) { .rotate-tip { display: none; } }

@media (max-width: 760px), (max-height: 480px) {
  .minimap-wrap { width: 118px; height: 118px; }
  .money { font-size: 18px; }
  .stat-box { min-width: 120px; padding: 5px 9px; }
  .stars { font-size: 15px; height: 18px; }
  .mission-panel { width: min(330px, 44vw); padding: 5px 10px; }
  .mp-name { font-size: 13px; }
  .mp-obj { font-size: 12px; }
  .speedo { bottom: calc(8px + var(--safe-b)); padding: 3px 10px; min-width: 100px; }
  .sp-val { font-size: 20px; }
  .prompt { bottom: calc(70px + var(--safe-b)); font-size: 13px; }
  .hud-btn { width: 34px; height: 34px; }
}
@media (orientation: portrait) and (max-width: 600px) {
  .mission-panel { top: calc(170px + var(--safe-t)); width: 92vw; }
  .toasts { top: calc(260px + var(--safe-t)); }
}

/* telas baixas (celular na horizontal) */
@media (max-height: 480px) {
  .district { display: none; }
  #btn-map { margin-top: 4px; }
  .tb { width: calc(60px * var(--tsize)); height: calc(60px * var(--tsize)); }
  .tb.tb-s { width: calc(46px * var(--tsize)); height: calc(46px * var(--tsize)); }
  .tb-accel { width: calc(70px * var(--tsize)); height: calc(70px * var(--tsize)); }
  #btns { bottom: calc(10px + var(--safe-b)); }
  #joy-base { width: calc(112px * var(--tsize)); height: calc(112px * var(--tsize)); bottom: calc(16px + var(--safe-b)); }
  .panel { padding: 14px 16px; }
  .chars { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .char { padding: 6px; }
  .char canvas { width: 64px; height: 64px; }
  .char .cp { min-height: 0; font-size: 11px; }
  .title-screen .logo { font-size: 40px; }
  .logo-sub { margin: 4px 0 12px; }
  .title-screen .btn { min-height: 38px; padding: 8px 16px; }
}

</style>
<canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-tl">
      <button id="btn-pause" class="hud-btn" aria-label="Pausar">❚❚</button>
      <div class="stat-box">
        <div id="money" class="money">$0</div>
        <div class="hp-row"><span class="hp-icon">♥</span><div class="bar"><div id="hp-fill"></div></div></div>
        <div id="stars" class="stars"></div>
      </div>
    </div>
    <div class="hud-tr">
      <div class="minimap-wrap">
        <canvas id="minimap" width="160" height="160"></canvas>
        <div id="clock" class="clock">08:00</div>
      </div>
      <div id="district" class="district">—</div>
      <button id="btn-map" class="hud-btn small" aria-label="Mapa">MAPA</button>
    </div>
    <div id="mission-panel" class="mission-panel hidden">
      <div class="mp-head"><span id="mp-cat"></span><span id="mp-timer" class="mp-timer"></span></div>
      <div id="mp-name" class="mp-name"></div>
      <div id="mp-obj" class="mp-obj"></div>
    </div>
    <div id="speedo" class="speedo hidden">
      <div id="sp-name" class="sp-name"></div>
      <div class="sp-row"><span id="sp-val" class="sp-val">0</span><span class="sp-unit">km/h</span></div>
      <div class="bar dmg"><div id="sp-dmg"></div></div>
    </div>
    <div id="prompt" class="prompt hidden"></div>

const __m_core_input_js = (() => {
// Entrada unificada: teclado + controles touch. O jogo lê apenas `input.state`.

const PREVENT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab']);

class Input {
  constructor() {
    this.keys = new Set();
    this.pressed = new Set();
    this.touch = null;
    this.enabled = true;
    this.state = this.blank();
    addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (PREVENT.has(e.code)) e.preventDefault();
      if (!this.keys.has(e.code)) this.pressed.add(e.code);
      this.keys.add(e.code);
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
  }

  blank() {
    return { moveX: 0, moveY: 0, steer: 0, throttle: 0, brake: 0, run: false, handbrake: false, horn: false,
      punch: false, interact: false, enterExit: false, pause: false, map: false, action: false };
  }

  k(...codes) { return codes.some((c) => this.keys.has(c)); }
  p(...codes) { return codes.some((c) => this.pressed.has(c)); }

  poll() {
    const s = this.blank();
    if (!this.enabled) { this.state = s; return s; }
    const left = this.k('KeyA', 'ArrowLeft'), right = this.k('KeyD', 'ArrowRight');
    const up = this.k('KeyW', 'ArrowUp'), down = this.k('KeyS', 'ArrowDown');
    s.moveX = (right ? 1 : 0) - (left ? 1 : 0);
    s.moveY = (down ? 1 : 0) - (up ? 1 : 0);
    s.steer = s.moveX;
    s.throttle = up ? 1 : 0;
    s.brake = down ? 1 : 0;
    s.run = this.k('ShiftLeft', 'ShiftRight');
    s.handbrake = this.k('Space');
    s.horn = this.k('KeyH');
    s.punch = this.p('Space');
    s.interact = this.p('KeyE');
    s.enterExit = this.p('KeyF', 'Enter', 'NumpadEnter');
    s.pause = this.p('Escape', 'KeyP');
    s.map = this.p('KeyM');

    const t = this.touch;
    if (t && t.active) {
      const ts = t.read();
      if (Math.abs(ts.joyX) > 0.01 || Math.abs(ts.joyY) > 0.01) {
        s.moveX = ts.joyX; s.moveY = ts.joyY;
        s.steer = Math.abs(ts.joyX) > 0.12 ? ts.joyX : 0;
      }
      if (ts.accel) s.throttle = 1;
      if (ts.brake) s.brake = 1;
      if (ts.run) s.run = true;
      if (ts.horn) s.horn = true;
      if (ts.actionHeld) s.handbrake = true;
      if (ts.actionPressed) s.action = true;
      if (ts.enterPressed) s.enterExit = true;
      if (ts.pausePressed) s.pause = true;
      if (ts.mapPressed) s.map = true;
    }
    this.state = s;
    return s;
  }

  endFrame() {
    this.pressed.clear();
    if (this.touch) this.touch.endFrame();
  }
}

return { Input };
})();

  constructor() {
    this.ctx = null;
    this.volume = 0.8;
    this.engine = null;
    this.siren = null;
    this.hornNode = null;
  }

  unlock() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
    } catch {
      return;
    }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate;
    this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  setVolume(v) {
    this.volume = v;
    if (this.master) this.master.gain.value = v;
  }

  suspend(on) {
    if (!this.ctx) return;
    if (on) this.ctx.suspend(); else this.ctx.resume();
  }

  // ---------- sons contínuos ----------
  updateEngine(active, rpm, throttle) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (!this.engine) {
      const o1 = this.ctx.createOscillator(); o1.type = 'sawtooth';
      const o2 = this.ctx.createOscillator(); o2.type = 'square';
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
      const g = this.ctx.createGain(); g.gain.value = 0;
      const g2 = this.ctx.createGain(); g2.gain.value = 0.35;
      o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(this.master);
      o1.start(); o2.start();
      this.engine = { o1, o2, f, g };
    }
    const e = this.engine;
    const base = 38 + rpm * 110;
    e.o1.frequency.setTargetAtTime(base, t, 0.05);
    e.o2.frequency.setTargetAtTime(base * 0.5, t, 0.05);
    e.f.frequency.setTargetAtTime(350 + rpm * 900 + throttle * 300, t, 0.08);
    e.g.gain.setTargetAtTime(active ? 0.05 + throttle * 0.05 + rpm * 0.03 : 0, t, 0.1);
  }

  updateSiren(intensity) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (!this.siren) {
      const o = this.ctx.createOscillator(); o.type = 'triangle';
      const lfo = this.ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 1.6;
      const lg = this.ctx.createGain(); lg.gain.value = 170;
      lfo.connect(lg); lg.connect(o.frequency);

const __m_core_save_js = (() => {
// Salvamento automático em localStorage (progresso + configurações).

const SAVE_KEY = 'portobrasa_save_v1';
const SET_KEY = 'portobrasa_settings_v1';

const DEFAULT_SETTINGS = {
  volume: 0.7,
  quality: 'auto', // auto | low | high
  touch: 'auto', // auto | on | off
  controlsSize: 1,
  controlsOpacity: 0.75,
  zoom: 1,
  vibration: true,
  showFps: false,
  traffic: 1,
};

function safeGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}
function safeSet(key, val) {
  try {
    localStorage.setItem(key, val);
    return true;
  } catch {
    return false;
  }
}

function loadSettings() {
  try {
    return { ...DEFAULT_SETTINGS, ...(JSON.parse(safeGet(SET_KEY)) || {}) };
  } catch {
    return { ...DEFAULT_SETTINGS };
  }
}
function saveSettings(s) {
  safeSet(SET_KEY, JSON.stringify(s));
}

function loadGame() {
  try {
    const d = JSON.parse(safeGet(SAVE_KEY));
    return d && d.version === 1 ? d : null;
  } catch {
    return null;
  }
}
function saveGame(data) {
  return safeSet(SAVE_KEY, JSON.stringify({ ...data, version: 1, savedAt: Date.now() }));
}
function deleteSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch {
    /* ignora */
  }
}

return { DEFAULT_SETTINGS, loadSettings, saveSettings, loadGame, saveGame, deleteSave };
})();

const __m_entities_vehicle_sprites_js = (() => {
// Sprites procedurais dos veículos (desenhados uma vez e guardados em cache).
// O veículo aponta para +X; origem no centro.

const { MODELS } = __m_entities_vehicle_models_js;
const cache = new Map();
const S = 3; // resolução do sprite (pixels por px de mundo)
const PAD = 4;

function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function getVehicleSprite(model, color, wrecked = false) {
  const key = model + color + (wrecked ? 'w' : '');
  let c = cache.get(key);
  if (c) return c;
  const m = MODELS[model];
  const L = m.l, W = m.w;
  const cv = document.createElement('canvas');
  cv.width = (L + PAD * 2) * S;
  cv.height = (W + PAD * 2) * S;
  const g = cv.getContext('2d');

    if (pv && pv.speed > 50) { dx = pv.vx / pv.speed; dy = pv.vy / pv.speed; } else return;
    const lane = c.nearestRoadLane(p.x + dx * 620, p.y + dy * 620, 4);
    if (!lane || cam.visible(lane.x, lane.y, 30)) return;
    const d = DIR_BY_BIT[c.dirs[c.idx(lane.tx, lane.ty)]];
    const perp = d.a + Math.PI / 2;
    for (const s of [-1, 1]) {
      const x = lane.x + Math.cos(d.a + Math.PI / 2) * 24 * s + (s > 0 ? 0 : 0);
      const y = lane.y + Math.sin(d.a + Math.PI / 2) * 24 * s;
      if (g.vehicleNear(x, y, 30)) continue;
      const v = new Vehicle('patrulha', x, y, perp + (s > 0 ? 0 : Math.PI));
      v.driver = 'ai';
      v.ai = { ...makeLaneAI(c, x, y), type: 'police', mode: 'block', officers: 2, deployCd: 0 };
      v.siren = true;
      g.addVehicle(v);
    }
  }

  driveUnit(v, dt) {
    const g = this.game, ai = v.ai;
    const p = g.playerPos();
    if (ai.deployCd > 0) ai.deployCd -= dt;
    if (ai.mode === 'patrol' || ai.mode === 'leave' || ai.mode === 'search') {
      if (ai.mode === 'search') {
        ai.cruise = 190;
        ai.searchT = (ai.searchT || 0) + dt;
        if (this.level === 0) ai.mode = 'leave';
        if (this.seen && this.level > 0) ai.mode = 'chase';
      }
      laneDrive(v, ai, g, dt);
      return;
    }
    if (this.level === 0) { this.calmDown(); return; }
    const dP = dist(v.x, v.y, p.x, p.y);
    if (ai.mode === 'block') {
      v.throttle = 0; v.brake = 0; v.handbrake = true;
      if (dP < 160 || this.unseen > 6) ai.mode = 'chase';
      this.maybeDeploy(v, dP);
      return;
    }
    // perseguição
    const onFoot = !g.player.vehicle;
    const pv = g.player.vehicle;
    let aimX, aimY;
    const direct = dP < 230 && g.los(v.x, v.y, p.x, p.y);
    if (direct) {
      aimX = p.x + (pv ? pv.vx * 0.35 : 0);
      aimY = p.y + (pv ? pv.vy * 0.35 : 0);
    } else {
      const a = this.drive.aim(v.x, v.y, 4);
      if (a) { aimX = a.x; aimY = a.y; } else { aimX = this.lastSeen.x; aimY = this.lastSeen.y; }
      // chegou à última posição e não vê o jogador → procura pelas ruas
      if (!this.seen && dist(v.x, v.y, this.lastSeen.x, this.lastSeen.y) < 120) {
        ai.mode = 'search';
        ai.searchT = 0;
        reacquireLane(v, ai, g.city);
        return;
      }
    }
    if (ai.rev > 0) {
      ai.rev -= dt;
      v.throttle = 0; v.brake = 1; v.handbrake = false;
      steerTo(v, aimX, aimY);
      v.steer = -v.steer;
      return;
    }
    const diff = steerTo(v, aimX, aimY, 2.8);
    let desired = v.m.maxSpeed * (0.7 + this.level * 0.06);
    if (Math.abs(diff) > 0.8) desired *= 0.45;
    if (onFoot && dP < 110) desired = 0;
    if (pv && pv.speed < 40 && dP < 70) desired = 0;
    speedControl(v, desired);
    if (v.throttle > 0.3 && v.speed < 10) {
      ai.stuck += dt;
      if (ai.stuck > 1.2) { ai.rev = 0.8 + Math.random() * 0.5; ai.stuck = 0; }
    } else ai.stuck = Math.max(0, ai.stuck - dt);
    this.maybeDeploy(v, dP);
  }

  maybeDeploy(v, dP) {
    const g = this.game, ai = v.ai;
    const pv = g.player.vehicle;
    const shouldExit = (!pv && dP < 170) || (pv && pv.speed < 45 && dP < 150);
    if (!shouldExit || ai.officers <= 0 || ai.deployCd > 0 || v.speed > 60) return;
    let onFoot = 0;
    for (const h of g.humans) if (h.kind === 'cop') onFoot++;
    if (onFoot >= 7) return;
    ai.deployCd = 0.6;
    ai.officers--;
    const dp = v.doorPoint(ai.officers % 2 ? 1 : -1);
    const spot = g.city.solidW(dp.x, dp.y) ? { x: v.x, y: v.y } : dp;
    const h = new Human('cop', spot.x, spot.y, { ...COP_LOOK });
    h.health = 60;
    h.ai = { car: v, mode: 'chase', hitCd: 0, speed: 128 + this.level * 8 + rand(-6, 6) };
    g.humans.push(h);
  }

  // retorna true se o policial está em contato para prender
  updateCop(h, dt) {
    const g = this.game, city = g.city;
    if (h.state === 'down') {
      updateDownHuman(h, dt, city);
      h.down -= dt;
      h.moving = 0;
      if (h.down <= 0) { if (h.ko) { h.fade -= dt * 0.5; if (h.fade <= 0) h.dead = true; } else h.state = 'walk'; }
      return false;
    }
    const ai = h.ai;
    if (ai.hitCd > 0) ai.hitCd -= dt;
    if (h.punchT > 0) h.punchT -= dt;
    const p = g.player;
    const pp = g.playerPos();
    if (this.level === 0) ai.mode = 'return';
    let tx, ty, contact = false;
    if (ai.mode === 'return') {
      const car = ai.car;
      if (car && !car.remove && !car.wrecked) { tx = car.x; ty = car.y; }
      else {
        if (!g.camera.visible(h.x, h.y, 40)) h.dead = true;
        tx = h.x + Math.cos(h.a) * 50; ty = h.y + Math.sin(h.a) * 50;
      }
      if (car && dist(h.x, h.y, car.x, car.y) < car.m.l / 2 + 14) {
        car.ai.officers++;
        h.dead = true;
        return false;
      }
      if (this.level > 0 && dist(h.x, h.y, pp.x, pp.y) < 300) ai.mode = 'chase';
    } else {
      tx = pp.x; ty = pp.y;
      const d = dist(h.x, h.y, pp.x, pp.y);
      const pv = p.vehicle;
      if (pv && d > 320) ai.mode = 'return';
      if (!pv) {
        if (d < 17) {
          contact = true;
          if (this.level >= 2 && ai.hitCd <= 0) {
            ai.hitCd = 1.1;
            h.punchT = 0.3;
            g.damagePlayer(this.level >= 4 ? 9 : 6);
            g.audio.play('punch');
          }
        }
      } else {
        const door = pv.doorPoint(-1);
        tx = door.x; ty = door.y;
        if (dist(h.x, h.y, door.x, door.y) < 16 && pv.speed < 25) contact = true;
      }
      if (!pv || d < 160) {
        // caminho direto se houver visão, senão segue o campo de fluxo a pé
        if (!g.los(h.x, h.y, tx, ty)) {
          const a = this.walk.aim(h.x, h.y, 2);
          if (a) { tx = a.x; ty = a.y; }
        }
      }
    }
    const dx = tx - h.x, dy = ty - h.y;
    const d = Math.hypot(dx, dy);
    if (d > 6) {
      const sp = ai.mode === 'return' ? 90 : ai.speed;
      moveHuman(h, (dx / d) * sp * dt, (dy / d) * sp * dt, city);
      h.a = Math.atan2(dy, dx);
      h.moving = 2;
      h.phase += dt * 15;
    } else h.moving = 0;
    return contact;
  }
}

      if (p.t === 'smoke') p.s += dt * 10;
    }
    for (const s of this.skids) s.a -= dt * 0.012;
    while (this.skids.length && this.skids[0].a <= 0) this.skids.shift();
  }

  drawSkids(g, view) {
    g.lineWidth = 3;
    g.lineCap = 'round';
    for (const s of this.skids) {
      if (s.x1 < view.x0 - 10 || s.x1 > view.x1 + 10 || s.y1 < view.y0 - 10 || s.y1 > view.y1 + 10) continue;
      g.strokeStyle = `rgba(15,15,15,${s.a})`;
      g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
    }
  }

  draw(g) {
    for (const p of this.list) {
      const k = p.life / p.max;
      switch (p.t) {
        case 'smoke':
          g.fillStyle = `rgba(${p.c},${p.c},${p.c},${0.45 * k})`;
          g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill();
          break;
        case 'spark':
          g.fillStyle = `rgba(255,${200 * k + 40 | 0},80,${k})`;
          g.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.4);
          break;
        case 'fire':
          g.fillStyle = `rgba(255,${120 + 120 * k | 0},30,${0.85 * k})`;
          g.beginPath(); g.arc(p.x, p.y, p.s * (0.5 + k * 0.5), 0, 7); g.fill();
          break;
        case 'flash':
          g.fillStyle = `rgba(255,230,160,${0.6 * k})`;
          g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill();
          break;
        case 'text':
          g.globalAlpha = Math.min(1, k * 2);
          g.font = 'bold 14px sans-serif'; g.textAlign = 'center';
          g.fillStyle = '#000'; g.fillText(p.str, p.x + 1, p.y + 1);
          g.fillStyle = p.color; g.fillText(p.str, p.x, p.y);
          g.globalAlpha = 1;
          break;
      }
    }
  }
}

return { Particles };
})();

const __m_ui_hud_js = (() => {
// HUD em DOM (dinheiro, vida, estrelas, missão, velocímetro, avisos) + minimapa.

const { T, MAP, districtAt, DISTRICT_NAMES } = __m_world_constants_js;
const { CATEGORIES } = __m_systems_mission_data_js;
const $ = (id) => document.getElementById(id);

class Hud {
  constructor(game) {
    this.game = game;
    this.el = {
      hud: $('hud'), money: $('money'), hp: $('hp-fill'), stars: $('stars'), clock: $('clock'), district: $('district'),
      mp: $('mission-panel'), mpCat: $('mp-cat'), mpName: $('mp-name'), mpObj: $('mp-obj'), mpTimer: $('mp-timer'),
      speedo: $('speedo'), spName: $('sp-name'), spVal: $('sp-val'), spDmg: $('sp-dmg'),
      prompt: $('prompt'), hint: $('hint'), toasts: $('toasts'), banner: $('banner'), fps: $('fps'),
    };

    $('btn-pause').addEventListener('click', () => game.togglePause());
    $('btn-map').addEventListener('click', () => game.ui.showPause('map'));
  }

  show(on) {
    this.el.hud.classList.toggle('hidden', !on);
  }

  set(key, el, prop, val) {
    if (this.cache[key] === val) return;
    this.cache[key] = val;
    el[prop] = val;
  }

  update(dt) {
    const g = this.game, E = this.el;
    this.set('money', E.money, 'textContent', '$' + g.money.toLocaleString('pt-BR'));
    const hpw = Math.max(0, (g.player.health / g.player.maxHealth) * 100).toFixed(0) + '%';
    if (this.cache.hp !== hpw) { this.cache.hp = hpw; E.hp.style.width = hpw; }
    // estrelas
    const lvl = g.police.level;
    const blink = lvl > 0 && !g.police.seen;
    const sk = lvl + (blink ? 'b' : '');
    if (this.cache.stars !== sk) {
      this.cache.stars = sk;
      let h = '';
      for (let i = 1; i <= 5; i++) h += `<span class="${i <= lvl ? 'on' : ''}">★</span>`;
      E.stars.innerHTML = h;
      E.stars.classList.toggle('blink', blink);
    }
    this.set('clock', E.clock, 'textContent', g.time.label());
    const p = g.playerPos();
    this.set('dist', E.district, 'textContent', DISTRICT_NAMES[districtAt(Math.floor(p.x / T), Math.floor(p.y / T))]);

    // painel de missão
    const M = g.missions.active;
    if (M) {
      if (this.cache.mpOn !== true) { this.cache.mpOn = true; E.mp.classList.remove('hidden'); }
      const cat = CATEGORIES[M.def.cat];
      this.set('mpCat', E.mpCat, 'textContent', `${cat.icon} ${cat.name}`);
      if (this.cache.mpCol !== cat.color) { this.cache.mpCol = cat.color; E.mp.style.borderLeftColor = cat.color; }
      this.set('mpName', E.mpName, 'textContent', M.def.name);
      this.set('mpObj', E.mpObj, 'textContent', g.missions.objective());
      if (M.timed) {
        const t = Math.max(0, Math.ceil(M.t));
        this.set('mpT', E.mpTimer, 'textContent', `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`);
        const low = t <= 15;
        if (this.cache.low !== low) { this.cache.low = low; E.mpTimer.classList.toggle('low', low); }
      } else this.set('mpT', E.mpTimer, 'textContent', '');
    } else if (this.cache.mpOn !== false) { this.cache.mpOn = false; E.mp.classList.add('hidden'); }

    // velocímetro
    const v = g.player.vehicle;
    if (v) {
      if (this.cache.spOn !== true) { this.cache.spOn = true; E.speedo.classList.remove('hidden'); }
      this.set('spName', E.spName, 'textContent', v.m.name);
      this.set('spVal', E.spVal, 'textContent', String(v.kmh));
      const dw = Math.max(0, (v.hp / v.maxHp) * 100).toFixed(0) + '%';
      if (this.cache.dmg !== dw) { this.cache.dmg = dw; E.spDmg.style.width = dw; }
    } else if (this.cache.spOn !== false) { this.cache.spOn = false; E.speedo.classList.add('hidden'); }

    // prompt
    const pr = g.prompt;
    const ptxt = pr ? (g.touchOn ? `${pr.text} — toque em <b>USAR</b>` : `<b>[E]</b> ${pr.text}`) : '';
    if (this.cache.prompt !== ptxt) {
      this.cache.prompt = ptxt;
      E.prompt.innerHTML = ptxt;
      E.prompt.classList.toggle('hidden', !pr);
    }
    if (this.hintT > 0) { this.hintT -= dt; if (this.hintT <= 0) E.hint.classList.add('hidden'); }
    if (g.settings.showFps) { E.fps.classList.remove('hidden'); this.set('fps', E.fps, 'textContent', `${g.fps} FPS`); }
    else E.fps.classList.add('hidden');
    this.drawMinimap();
  }

  hint(text) {
    this.el.hint.textContent = text;
    this.el.hint.classList.remove('hidden');
    this.hintT = 1.2;
  }

  toast(text, cls = '') {
    const d = document.createElement('div');
    d.className = 'toast ' + cls;
    d.textContent = text;
    this.el.toasts.appendChild(d);
    while (this.el.toasts.children.length > 4) this.el.toasts.firstChild.remove();
    setTimeout(() => d.remove(), 2600);
  }

  moneyBump() {
    const m = this.el.money;
    m.classList.remove('bump');
    void m.offsetWidth;
    m.classList.add('bump');
  }

  flashStars() {
    const s = this.el.stars;
    s.classList.remove('flash');
    void s.offsetWidth;
    s.classList.add('flash');
  }

  missionBanner(name, cat) {
    const b = this.el.banner;
    b.innerHTML = `<div class="b1">${cat}</div><div class="b2">${name}</div>`;
    b.classList.remove('hidden', 'anim');
    void b.offsetWidth;
    b.classList.add('anim');
  }

  // ---------- minimapa ----------
  drawMinimap() {
    const g = this.game, ctx = this.mmg, cv = this.mm;
    if (!this.mapImg) this.mapImg = g.worldRenderer.buildMapImage(2);
    const W = cv.width, H = cv.height;
    const p = g.playerPos();
    const span = g.player.vehicle ? 70 : 52; // tiles visíveis
    const scale = W / span; // px por tile
    const cx = p.x / T, cy = p.y / T;
    ctx.fillStyle = '#0d1218';
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.mapImg, (cx - span / 2) * 2, (cy - span / 2) * 2, span * 2, span * 2, 0, 0, W, H);
    const toMM = (wx, wy) => ({ x: (wx / T - cx) * scale + W / 2, y: (wy / T - cy) * scale + H / 2 });
    const clampEdge = (q) => {
      const m = 8;
      const inside = q.x >= m && q.y >= m && q.x <= W - m && q.y <= H - m;
      if (inside) return { ...q, edge: false };
      const dx = q.x - W / 2, dy = q.y - H / 2;
      const k = Math.min((W / 2 - m) / Math.abs(dx || 1e-6), (H / 2 - m) / Math.abs(dy || 1e-6));
      return { x: W / 2 + dx * k, y: H / 2 + dy * k, edge: true };
    };
    // locais fixos
    const L = g.city.locations;
    const icons = [[L.garage, 'G', '#4fa3ff'], [L.respray, 'P', '#c77dff'], [L.hospital, 'H', '#ff6b6b'], [L.police, '★', '#7aa2ff']];
    for (const [loc, ch, col] of icons) {
      const q = toMM(loc.x, loc.y);
      if (q.x < -6 || q.y < -6 || q.x > W + 6 || q.y > H + 6) continue;
      this.badge(ctx, q.x, q.y, ch, col, 6.5);
    }
    // polícia
    const t = g.time.total;
    for (const v of g.vehicles) {
      if (!v.isPolice || v.wrecked) continue;
      const q = toMM(v.x, v.y);
      if (q.x < 0 || q.y < 0 || q.x > W || q.y > H) continue;
      ctx.fillStyle = Math.floor(t * 4) % 2 ? '#ff3b3b' : '#3b7bff';
      ctx.beginPath(); ctx.arc(q.x, q.y, 3.4, 0, 7); ctx.fill();
    }
    // missões
    for (const mk of g.missions.markers()) {
      const q = clampEdge(toMM(mk.x, mk.y));
      if (mk.kind === 'giver') {
        if (q.edge) continue;
        this.badge(ctx, q.x, q.y, mk.def ? CATEGORIES[mk.def.cat].icon : '!', mk.dim ? '#777' : mk.color, 6.5);
      } else {
        ctx.fillStyle = mk.color;
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(q.x, q.y, mk.kind === 'next' ? 3.5 : 5.5, 0, 7); ctx.fill(); ctx.stroke();
      }
    }
    // jogador
    const a = g.player.vehicle ? g.player.vehicle.a : g.player.a;
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.rotate(a);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -5); ctx.lineTo(-2, 0); ctx.lineTo(-5, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // norte
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(W / 2 - 7, 2, 14, 13);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('N', W / 2, 9);
  }

  badge(ctx, x, y, ch, col, r) {
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0b0d12'; ctx.font = `bold ${r * 1.4}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, x, y + 0.5);
  }

  // Mapa completo (aba Mapa da pausa)
  drawFullMap(cv) {
    const g = this.game, ctx = cv.getContext('2d');
    if (!this.mapImg) this.mapImg = g.worldRenderer.buildMapImage(2);
    const W = cv.width, s = W / MAP;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.mapImg, 0, 0, W, W);
    const L = g.city.locations;
    for (const [loc, ch, col] of [[L.garage, 'G', '#4fa3ff'], [L.respray, 'P', '#c77dff'], [L.hospital, 'H', '#ff6b6b'], [L.police, '★', '#7aa2ff']]) {
      this.badge(ctx, (loc.x / T) * s, (loc.y / T) * s, ch, col, 9);
    }
    for (const mk of g.missions.markers()) {
      const x = (mk.x / T) * s, y = (mk.y / T) * s;
      if (mk.kind === 'giver') this.badge(ctx, x, y, CATEGORIES[mk.def.cat].icon, mk.dim ? '#777' : mk.color, 9);
      else { ctx.fillStyle = mk.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); ctx.stroke(); }
    }
    const p = g.playerPos();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc((p.x / T) * s, (p.y / T) * s, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc((p.x / T) * s, (p.y / T) * s, 2.5, 0, 7); ctx.fill();
    // nomes dos distritos
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    const labels = [['CENTRO COMERCIAL', 84, 68], ['JARDIM AURORA', 26, 60], ['DISTRITO FABRIL', 134, 40], ['PORTO VELHO', 134, 126], ['VILA DAS OFICINAS', 26, 140], ['MERCADO NOVO', 84, 134], ['ORLA', 70, 156]];
    for (const [n, x, y] of labels) {
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      const w = ctx.measureText(n).width + 8;
      ctx.fillRect(x * s - w / 2, y * s - 9, w, 17);
      ctx.fillStyle = '#e8e2d0'; ctx.fillText(n, x * s, y * s + 1);
    }
  }
}

const __m_ui_menus_js = (() => {
// Telas: título, seleção de personagem, pausa (mapa, missões, estatísticas,
// configurações, controles), briefing/conclusão/falha de missão, garagem e final.

const { CHARACTERS, drawCharacterPreview } = __m_entities_human_js;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtTime = (s) => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const money = (n) => '$' + Math.round(n).toLocaleString('pt-BR');

// Tela cheia + travar paisagem (opcional: alguns navegadores/apps recusam)
function canFullscreen() {
  const d = document.documentElement;
  return !!(d.requestFullscreen || d.webkitRequestFullscreen) && !document.fullscreenElement;
}
async function goFullscreen() {
  const d = document.documentElement;
  try {
    if (d.requestFullscreen) await d.requestFullscreen({ navigationUI: 'hide' });
    else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {});
  } catch { /* recusado pelo navegador */ }
}

class UI {
  constructor(game) {
    this.game = game;
    this.root = document.getElementById('screen');
    this.open = false;
    this.current = null;
    this.anim = null;
  }

  show(html, { solid = false, name = '' } = {}) {
    cancelAnimationFrame(this.anim);
    this.root.innerHTML = html;
    this.root.classList.add('show');
    this.root.classList.toggle('solid', solid);
    this.open = true;
    this.current = name;
    this.game.setPaused(true);
    this.root.querySelectorAll('[data-act]').forEach((b) => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        this.game.audio.play('click');
        const fn = this.handlers[b.dataset.act];
        if (fn) fn(b.dataset.arg, b);
      });
    });
  }

  close() {
    cancelAnimationFrame(this.anim);
    this.root.classList.remove('show');
    this.root.innerHTML = '';
    this.open = false;
    this.current = null;
    this.game.setPaused(false);
  }

  // ---------------- Título ----------------
  showTitle() {
    const g = this.game;
    const has = g.hasSave();
    this.handlers = {
      continue: () => g.continueGame(),
      new: () => {
        if (has) this.confirm('Começar um novo jogo apagará o progresso salvo. Continuar?', () => this.showCharSelect(), () => this.showTitle());
        else this.showCharSelect();
      },
      settings: () => this.showSettingsStandalone(),
      controls: () => this.showControlsStandalone(),
      fullscreen: () => goFullscreen(),
    };
    this.show(`
      <div class="title-screen">
        <div class="logo">PORTO<br>BRASA</div>
        <div class="logo-sub">cidade sem freio</div>
        <div class="col">
          ${has ? '<button class="btn primary" data-act="continue">▶ Continuar</button>' : ''}
          <button class="btn ${has ? '' : 'primary'}" data-act="new">Novo jogo</button>
          <button class="btn" data-act="controls">Controles</button>
          <button class="btn" data-act="settings">Configurações</button>
          ${canFullscreen() ? '<button class="btn" data-act="fullscreen">⛶ Tela cheia</button>' : ''}
        </div>
        <div class="rotate-tip">Dica: no celular, jogue com a tela na horizontal.</div>
        <div class="foot-note">Jogo original inspirado nos clássicos de ação top-down. Todos os nomes, lugares e personagens são fictícios.</div>
      </div>`, { solid: true, name: 'title' });
  }

  confirm(text, yes, no) {
    this.handlers = { yes, no };
    this.show(`<div class="panel narrow"><h2>Confirmar</h2><p>${esc(text)}</p>
      <div class="row"><button class="btn primary" data-act="yes">Sim</button><button class="btn" data-act="no">Não</button></div></div>`, { solid: true });
  }

  // ---------------- Personagem ----------------
  showCharSelect() {
    const g = this.game;
    let sel = 0;
    this.handlers = {
      pick: (i) => {
        sel = +i;
        this.root.querySelectorAll('.char').forEach((c, k) => c.classList.toggle('sel', k === sel));
      },
      start: () => g.newGame(CHARACTERS[sel].id),
      back: () => this.showTitle(),
    };
    this.show(`
      <div class="panel">
        <h2>Escolha seu personagem</h2>
        <p>Cada personagem tem uma vantagem própria.</p>
        <div class="chars">
          ${CHARACTERS.map((c, i) => `
            <div class="char ${i === 0 ? 'sel' : ''}" data-act="pick" data-arg="${i}">
              <canvas width="220" height="220"></canvas>
              <div class="cn">${esc(c.name)}</div>
              <div class="cp">${esc(c.perk)}</div>
            </div>`).join('')}
        </div>
        <div class="row"><button class="btn primary" data-act="start">Começar a jogar</button><button class="btn" data-act="back">Voltar</button></div>
      </div>`, { solid: true, name: 'chars' });
    const cvs = [...this.root.querySelectorAll('.char canvas')];
    const loop = (t) => {
      cvs.forEach((cv, i) => drawCharacterPreview(cv, CHARACTERS[i].look, i === sel ? t / 1000 : 0));
      this.anim = requestAnimationFrame(loop);
    };
    this.anim = requestAnimationFrame(loop);
  }

  // ---------------- Pausa ----------------
  showPause(tab = 'missions') {
    const g = this.game;
    if (!g.running) return;
    const tabs = [['map', 'Mapa'], ['missions', 'Missões'], ['stats', 'Estatísticas'], ['settings', 'Configurações'], ['controls', 'Controles']];
    this.handlers = {
      tab: (t) => this.showPause(t),
      resume: () => this.close(),
      save: () => { g.autosave(); g.hud.toast('Jogo salvo', 'ok'); this.close(); },
      quit: () => { g.autosave(); g.quitToTitle(); },
      fullscreen: () => goFullscreen(),
      ...this.settingsHandlers(),

    let body = '';

    this.show(`
      <div class="panel">

        <div class="row">
          <button class="btn primary" data-act="resume">▶ Continuar</button>

          ${canFullscreen() ? '<button class="btn" data-act="fullscreen">⛶ Tela cheia</button>' : ''}
          <button class="btn danger" data-act="quit">Sair para o menu</button>
        </div>
      </div>`, { name: 'pause' });
    this.bindSettings();
    if (tab === 'map') {
      const cv = this.root.querySelector('.map-canvas');
      g.hud.drawFullMap(cv);
    }
  }

  mapHtml() {
    return `<canvas class="map-canvas" width="672" height="672"></canvas>
      <div class="legend">
        <span><i style="background:#fff"></i>Você</span><span><i style="background:#4fa3ff"></i>Garagem</span>
        <span><i style="background:#c77dff"></i>Pintura Rápida</span><span><i style="background:#ff6b6b"></i>Hospital</span>
        <span><i style="background:#7aa2ff"></i>Delegacia</span><span><i style="background:#f2b631"></i>Missões</span>
        <span><i style="background:#ffd23a"></i>Objetivo</span>
      </div>`;
  }

  missionsHtml() {
    const M = this.game.missions;
    const story = M.defs.filter((d) => d.cat === 'story' || d.story);
    const side = M.defs.filter((d) => !(d.cat === 'story' || d.story));
    const item = (d) => {
      const c = CATEGORIES[d.cat];
      const done = M.completed.has(d.id);

const __m_ui_touch_js = (() => {
// Controles touchscreen: joystick virtual dinâmico (esquerda) e botões
// contextuais (direita) que aparecem conforme a situação do personagem.

class TouchControls {
  constructor() {
    this.root = document.getElementById('touch');
    this.zone = document.getElementById('joy-zone');
    this.base = document.getElementById('joy-base');
    this.knob = document.getElementById('joy-knob');
    this.active = false;
    this.joy = { id: null, x: 0, y: 0, cx: 0, cy: 0 };
    this.held = { accel: false, brake: false, run: false, action: false, enter: false, horn: false };
    this.pressedSet = new Set();
    this.vibrate = true;
    this.ctx = '';

    const z = this.zone;
    z.addEventListener('pointerdown', (e) => this.joyStart(e));
    z.addEventListener('pointermove', (e) => this.joyMove(e));
    z.addEventListener('pointerup', (e) => this.joyEnd(e));
    z.addEventListener('pointercancel', (e) => this.joyEnd(e));
    z.addEventListener('lostpointercapture', (e) => this.joyEnd(e));

    for (const b of this.root.querySelectorAll('.tb')) {
      const name = b.dataset.b;
      const down = (e) => {
        e.preventDefault();
        try { b.setPointerCapture(e.pointerId); } catch { /* ignora */ }
        this.held[name] = true;
        this.pressedSet.add(name);
        b.classList.add('on');
        if (this.vibrate && navigator.vibrate) navigator.vibrate(12);
      };
      const up = (e) => {
        e.preventDefault();
        this.held[name] = false;
        b.classList.remove('on');
      };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
      b.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    this.root.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  show(on) {
    this.active = on;
    this.root.classList.toggle('hidden', !on);
    if (!on) this.reset();
  }

  reset() {
    for (const k in this.held) this.held[k] = false;
    this.joy.id = null; this.joy.x = 0; this.joy.y = 0;
    this.knob.style.transform = '';
    for (const b of this.root.querySelectorAll('.tb')) b.classList.remove('on');
  }

  setStyle(size, opacity) {
    document.documentElement.style.setProperty('--tsize', size);
    document.documentElement.style.setProperty('--topa', opacity);
  }

  // Contexto: 'foot' | 'car'; nearVehicle mostra ENTRAR; canInteract destaca AÇÃO.
  setContext(mode, nearVehicle, canInteract) {
    const key = mode + nearVehicle + canInteract;
    if (key === this.ctx) return;
    this.ctx = key;
    this.root.classList.toggle('foot', mode === 'foot');
    this.root.classList.toggle('car', mode === 'car');
    this.root.classList.toggle('no-enter', mode === 'foot' && !nearVehicle);
    const enter = this.root.querySelector('.tb-enter');
    enter.textContent = mode === 'car' ? 'SAIR' : 'ENTRAR';
    const act = this.root.querySelector('.tb-action');
    act.textContent = canInteract ? 'USAR' : mode === 'car' ? 'FREIO DE MÃO' : 'SOCO';
    act.classList.toggle('ready', !!canInteract);
  }

  joyStart(e) {
    if (this.joy.id !== null) return;
    e.preventDefault();
    this.joy.id = e.pointerId;
    try { this.zone.setPointerCapture(e.pointerId); } catch { /* ignora */ }
    const r = this.base.getBoundingClientRect();
    const zr = this.zone.getBoundingClientRect();
    // joystick dinâmico: centraliza onde o dedo tocou
    const w = r.width;
    let left = e.clientX - zr.left - w / 2, top = e.clientY - zr.top - w / 2;
    left = Math.max(4, Math.min(zr.width - w - 4, left));
    top = Math.max(4, Math.min(zr.height - w - 4, top));
    this.base.style.left = left + 'px';
    this.base.style.top = top + 'px';
    this.base.style.bottom = 'auto';
    this.joy.cx = zr.left + left + w / 2;
    this.joy.cy = zr.top + top + w / 2;
    this.joyMove(e);
  }

  joyMove(e) {
    if (e.pointerId !== this.joy.id) return;
    e.preventDefault();
    const r = this.base.getBoundingClientRect().width / 2;
    let dx = e.clientX - this.joy.cx, dy = e.clientY - this.joy.cy;
    const l = Math.hypot(dx, dy);
    if (l > r) { dx = (dx / l) * r; dy = (dy / l) * r; }
    this.knob.style.transform = `translate(${dx}px, ${dy}px)`;
    let nx = dx / r, ny = dy / r;
    const m = Math.hypot(nx, ny);
    if (m < 0.15) { nx = 0; ny = 0; }
    this.joy.x = nx; this.joy.y = ny;
  }

  joyEnd(e) {
    if (e.pointerId !== this.joy.id) return;
    this.joy.id = null;
    this.joy.x = 0; this.joy.y = 0;
    this.knob.style.transform = '';
    this.base.style.left = '';
    this.base.style.top = '';
    this.base.style.bottom = '';
  }

  read() {
    const p = this.pressedSet;
    return {
      joyX: this.joy.x, joyY: this.joy.y,
      accel: this.held.accel, brake: this.held.brake, run: this.held.run, horn: this.held.horn,
      actionHeld: this.held.action, actionPressed: p.has('action'), enterPressed: p.has('enter'),
      pausePressed: p.has('pause'), mapPressed: p.has('map'),
    };
  }

  endFrame() {
    this.pressedSet.clear();
  }
}

return { TouchControls };
})();
