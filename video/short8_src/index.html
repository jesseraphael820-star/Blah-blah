function tex(fn,w=1024,h=512){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');const img=ctx.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w*8;const n=fbm(u,y/h*4)*(1-x/w)+fbm(u-8,y/h*4)*(x/w);const c=fn(n,(y/h-.5)*Math.PI,x,y,u);const i=(y*w+x)*4;img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255}

   h+=`<div class="row ${curIdx==i?'cur':''} ${isQ?'q':''}" style="transform:scale(${show*(curIdx==i?1.06:1)})"><span class="n">#${nm[0]}</span><span class="t">${isQ?(k=='venus'?'??? 👀':'???'):nm[1].split(' ').slice(-1)[0]}</span></div>`});h+='</div>'}
 if(NAMES[s.k]){const nm=NAMES[s.k];h+=`<div class="badge" style="transform:scale(${back(lt/.25)}) rotate(-6deg)">#${nm[0]}</div>`;
  h+=`<div class="place" style="opacity:${clamp((lt-.2)/.1)};transform:translateX(${(1-ease((lt-.2)/.3))*-80}px)">${nm[1]}<div style="font-size:40px;margin-top:10px;color:#cfe">${nm[2]}</div></div>`;
  const ck=back((lt-1)/.25);h+=`<div class="chip" style="top:${nm[1].length>12?740:650}px;transform:scale(${ck}) rotate(${(1-clamp((lt-1)/.3))*-10+2}deg)">${nm[3]}</div>`}
 if(s.k=='end')h+=`<div class="emo" style="left:440px;top:560px;font-size:200px;transform:scale(${back((lt-.4)/.3)})">🤔</div>`;
 // legenda: janela de até 3 palavras, palavra atual em amarelo
 const ws=s.words;let ci=-1;ws.forEach((w,i)=>{if(lt>=w[1])ci=i});
 if(ci>=0){const st=Math.floor(ci/3)*3;const chunk=ws.slice(st,st+3);const e=lt-ws[st][1];
  h+=`<div class="cap" style="transform:scale(${back(e/.15)})">${chunk.map((w,i)=>st+i<=ci?`<span class="${st+i==ci?'on':''}">${w[0]}</span>`:'').join(' ')}</div>`}
 h+=`<div class="bar" style="width:${t/TOTAL*100}%"></div>`;
 if(whip>.5)h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${(whip-.5)*1.2}"></div>`;
 ui.innerHTML=h;ui.style.transform=shake?`translate(${Math.sin(t*97)*shake*.25}px,${Math.cos(t*83)*shake*.25}px)`:'';
}
window.renderAt=renderAt;
</script></body></html>
