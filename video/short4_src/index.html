<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display","Inter",sans-serif}
canvas{position:absolute;inset:0}
#ui{position:absolute;inset:0;color:#fff;pointer-events:none}
.cap{position:absolute;left:50px;right:50px;text-align:center;font-weight:900;text-transform:uppercase;line-height:.98;
 -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.55);letter-spacing:-1px}
.y{color:#ffe600}.r{color:#ff2d3d}.c{color:#4df3ff}.o{color:#ff8a00}.g{color:#4ade80}
.bar{position:absolute;left:0;top:0;height:12px;background:#ffe600}
.timer{position:absolute;left:0;right:0;text-align:center;font:900 170px "JetBrains Mono",monospace;color:#ffe600;-webkit-text-stroke:10px #000;paint-order:stroke fill}
</style></head><body>
<script src="node_modules/three/build/three.min.js"></script>
<div id="ui"></div>
<script>
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,W/H,.1,800);
const amb=new THREE.AmbientLight(0xffffff,.1);scene.add(amb);
const sunLight=new THREE.PointLight(0xfff1d0,3,0,0);scene.add(sunLight);
const rimLight=new THREE.DirectionalLight(0x88aaff,0);rimLight.position.set(5,3,10);scene.add(rimLight);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o));
let seed=41;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=[];for(let i=0;i<512;i++)P.push(Math.floor(rnd()*256));
const hash=(x,y)=>P[(P[x&255]+y)&255]/255;const sm=t=>t*t*(3-2*t);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
 return a+(b-a)*sm(xf)+(c-a)*sm(yf)+(a-b-c+d)*sm(xf)*sm(yf)}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vn(x*f,y*f);a*=.5;f*=2}return s}
function tex(fn,w=1024,h=512){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');const img=ctx.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w*8;const n=fbm(u,y/h*4)*(1-x/w)+fbm(u-8,y/h*4)*(x/w);
  const c=fn(n,(y/h-.5)*Math.PI,x,y,u);const i=(y*w+x)*4;img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255}
 ctx.putImageData(img,0,0);return new THREE.CanvasTexture(cv)}
const earthTex=tex((n,lat,x,y,u)=>{if(Math.abs(lat)>1.25)return[235,235,235];if(n>.52){const d=.7+n*.5,dry=fbm(u*2,y/64)>.55;return[(dry?150:50)*d,120*d,(dry?60:40)*d]}const d=.55+n*.5;return[8*d,60*d,160*d]});
const iceTex=tex((n,lat,x,y,u)=>{const v=200+n*55;return n>.52?[v,v,v]:[v*.75,v*.88,v]});
const sunTex=tex((n,lat,x,y,u)=>{const v=fbm(x/30,y/30);return[255,150+v*100,30+v*60]},512,256);

// estrelas
const starPts=(()=>{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<3000;i++){const v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(300+rnd()*200);p.push(v.x,v.y,v.z)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const s=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1}));scene.add(s);return s})();

// ---- espaço ----
const space=new THREE.Group();scene.add(space);
const sunMat=new THREE.MeshBasicMaterial({map:sunTex,color:0xffffff});
const sunB=new THREE.Mesh(new THREE.SphereGeometry(3,64,48),sunMat);space.add(sunB);
const glows=[[3.6,.35],[4.6,.18],[6.5,.08]].map(([r,o])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.MeshBasicMaterial({color:0xffa500,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));m.userData.o=o;sunB.add(m);return m});
const earth=new THREE.Group();space.add(earth);
const globe=new THREE.Mesh(new THREE.SphereGeometry(1,64,48),new THREE.MeshStandardMaterial({map:earthTex,roughness:.85}));earth.add(globe);
const ice=new THREE.Mesh(new THREE.SphereGeometry(1.005,64,48),new THREE.MeshStandardMaterial({map:iceTex,roughness:.4,transparent:true,opacity:0}));earth.add(ice);
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.06,48,32),new THREE.MeshBasicMaterial({color:0x5fb8ff,transparent:true,opacity:.18,side:THREE.BackSide}));earth.add(atm);
const moon=new THREE.Mesh(new THREE.SphereGeometry(.3,32,24),new THREE.MeshStandardMaterial({color:0xcfcfcf,roughness:1}));space.add(moon);
const orbitL=new THREE.Mesh(new THREE.TorusGeometry(9,.035,8,200),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35}));orbitL.rotation.x=Math.PI/2;space.add(orbitL);
const pathL=new THREE.Mesh(new THREE.BoxGeometry(30,.05,.05),new THREE.MeshBasicMaterial({color:0xff2d3d,transparent:true,opacity:.8}));space.add(pathL);
// fótons
const photons=[];for(let i=0;i<160;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),new THREE.MeshBasicMaterial({color:0xffe066}));m.userData={f:rnd(),o:(rnd()-.5)*.9,o2:(rnd()-.5)*.9};space.add(m);photons.push(m)}

// ---- chão ----
const ground=new THREE.Group();scene.add(ground);
const groundMat=M(0x3c7d3a,{roughness:1});
const gplane=new THREE.Mesh(new THREE.PlaneGeometry(400,400),groundMat);gplane.rotation.x=-Math.PI/2;ground.add(gplane);
const trees=[];for(let i=0;i<26;i++){const t=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2.4),M(0x5b3a1a));tr.position.y=1.2;
 const lv=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,0),M(0x16a34a,{flatShading:true}));lv.position.y=3.3;t.add(tr,lv);
 t.position.set((rnd()-.5)*26,0,-2-rnd()*22);t.userData={lv,ph:rnd()};ground.add(t);trees.push(t)}
const flowers=[];for(let i=0;i<40;i++){const f=new THREE.Group();const st=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.8),M(0x15803d));st.position.y=.4;
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),M([0xfacc15,0xf472b6,0xf97316][i%3]));hd.position.y=.85;f.add(st,hd);f.position.set((rnd()-.5)*12,0,4+rnd()*6);f.userData={hd};ground.add(f);flowers.push(f)}
// Islândia
const isl=new THREE.Group();scene.add(isl);
const snow=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M(0xe8f0ff,{roughness:.9}));snow.rotation.x=-Math.PI/2;isl.add(snow);
const volc=new THREE.Mesh(new THREE.ConeGeometry(9,8,40,1,true),M(0x2a2a2e,{flatShading:true}));volc.position.set(-3,4,-26);isl.add(volc);
const lava=new THREE.Mesh(new THREE.CircleGeometry(2.2,32),new THREE.MeshBasicMaterial({color:0xff5a00}));lava.rotation.x=-Math.PI/2;lava.position.set(-3,7.2,-26);isl.add(lava);
const lavaL=new THREE.PointLight(0xff6a00,4,60,1.5);lavaL.position.set(-3,10,-24);isl.add(lavaL);
const houses=[];for(let i=0;i<7;i++){const o=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.2,2.4),M([0xb91c1c,0x1d4ed8,0xf5f5f4][i%3]));b.position.y=1.1;
 const r=new THREE.Mesh(new THREE.ConeGeometry(2.2,1.4,4),M(0xffffff));r.position.y=2.9;r.rotation.y=Math.PI/4;
 const w=new THREE.Mesh(new THREE.PlaneGeometry(.7,.6),new THREE.MeshBasicMaterial({color:0xffd27a}));w.position.set(0,1.2,1.21);o.add(b,r,w);
 o.position.set(-10+i*3.4,0,-4-(i%2)*3);isl.add(o);houses.push(o)}
const hl=new THREE.PointLight(0xffb060,2.5,30,1.5);hl.position.set(0,4,2);isl.add(hl);
const steam=[];for(let i=0;i<60;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.6+rnd()*.8,10,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.3,depthWrite:false}));
 m.userData={x:-3+(rnd()-.5)*3,z:-26+(rnd()-.5)*3,o:rnd()*6};isl.add(m);steam.push(m)}
const flakes=(()=>{const g=new THREE.BufferGeometry(),p=new Float32Array(1500*3);for(let i=0;i<1500;i++){p[i*3]=(rnd()-.5)*60;p[i*3+1]=rnd()*30;p[i*3+2]=-rnd()*40+10}
 g.setAttribute('position',new THREE.BufferAttribute(p,3));const s=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.18}));scene.add(s);s.userData.base=p.slice();return s})();

// ---------------- roteiro ----------------
const S=[{k:'hook',d:3.4},{k:'timer',d:5.4},{k:'orbit',d:4.4},{k:'moon',d:3.8},{k:'cold',d:4.8},{k:'plants',d:4},{k:'isl',d:4.6},{k:'end',d:5}];
let acc=0;for(const s of S){s.t0=acc;acc+=s.d}window.TOTAL=acc;window.CUTS=S.map(s=>s.t0);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ui=document.getElementById('ui');
function cap(lt,at,top,size,html){if(lt<at)return'';const k=back((lt-at)/.2);
 return `<div class="cap" style="top:${top}px;font-size:${size}px;transform:scale(${k});opacity:${clamp((lt-at)/.06)}">${html}</div>`}
function sunOn(k){ // k: 1 aceso, 0 apagado
 sunMat.color.setRGB(.06+.94*k,.03+.97*k,.02+.98*k);glows.forEach(g=>g.material.opacity=g.userData.o*k);sunLight.intensity=3*k}
const lerpC=(a,b,k)=>new THREE.Color(a).lerp(new THREE.Color(b),k);

function renderAt(t){
 const s=S.find(s=>t>=s.t0&&t<s.t0+s.d)||S[S.length-1];const lt=t-s.t0,d=s.d;
 const isSpace=['hook','timer','orbit','moon','cold','end'].includes(s.k);
 space.visible=isSpace;ground.visible=s.k=='plants';isl.visible=s.k=='isl';flakes.visible=s.k=='isl'||s.k=='plants';
 scene.background=new THREE.Color(isSpace?0x000006:(s.k=='isl'?0x0b1020:0x0a0f1a));scene.fog=isSpace?null:new THREE.Fog(scene.background.getHex(),30,120);
 starPts.visible=isSpace;sunB.visible=true;earth.visible=true;moon.visible=false;orbitL.visible=false;pathL.visible=false;photons.forEach(p=>p.visible=false);
 ice.material.opacity=0;rimLight.intensity=0;amb.intensity=.08;earth.scale.setScalar(1);sunB.position.set(0,0,0);
 let shake=0,h='';
 if(s.k=='hook'){const off=1.0;sunOn(lt<off?1:0);
  const a=.7+lt*.25;earth.position.set(Math.cos(a)*9,0,Math.sin(a)*9);globe.rotation.y=t*.5;orbitL.visible=true;earth.scale.setScalar(1.3);
  cam.position.set(0,9-lt*.6,26-lt*1.2);cam.lookAt(0,-1.5,0);
  if(lt>off)shake=Math.exp(-(lt-off)*4)*32;
  h+=cap(lt,0,280,110,'O SOL ACABOU')+cap(lt,0,395,140,'<span class="r">DE APAGAR</span>');
  h+=cap(lt,1.5,1380,84,'...E VOCÊ')+cap(lt,1.8,1480,110,'<span class="y">NEM PERCEBEU</span>');
 }
 if(s.k=='timer'){sunOn(0);sunB.position.set(-5,6,0);earth.position.set(5,-7,0);earth.scale.setScalar(1.6);globe.rotation.y=t*.5;
  cam.position.set(0,-.5,34);cam.lookAt(0,-.5,0);
  const total=500,el=clamp((lt-.3)/4.2)*total;const rem=Math.max(0,total-el);
  const tail=el/total; // fração do caminho que o fim da luz percorreu
  const A=sunB.position,B=earth.position;
  photons.forEach(p=>{p.visible=true;const u=p.userData;const f=tail+(1-tail)*((u.f+lt*.35)%1);if(tail>=1){p.visible=false;return}
   p.position.set(A.x+(B.x-A.x)*f+u.o,A.y+(B.y-A.y)*f+u.o2,0)});
  const lit=tail<1?1:Math.max(0,1-(lt-4.5)*3);sunLight.intensity=0;
  rimLight.intensity=0;amb.intensity=.08;
  // Terra iluminada pela "última luz"
  sunLight.position.copy(A);sunLight.intensity=3*lit;
  const mm=Math.floor(rem/60),ss=Math.floor(rem%60);
  h+=cap(lt,.05,250,84,'A ÚLTIMA LUZ DO SOL')+`<div class="timer" style="top:350px;opacity:${clamp(lt/.2)}">${mm}:${String(ss).padStart(2,'0')}</div>`+cap(lt,.3,560,70,'AINDA ESTÁ A CAMINHO')+cap(lt,1.2,1460,60,'A LUZ LEVA <span class="y">8 MIN E 20 S</span><br>PRA CHEGAR NA TERRA');
  if(tail>=1)h+=cap(lt,4.6,1600,120,'<span class="r">APAGOU.</span>');
 }
 if(s.k=='orbit'){sunOn(0);sunLight.intensity=0;rimLight.intensity=.6;amb.intensity=.1;
  const a0=1.1,leave=.9;let ex,ez;const ta=a0+Math.min(lt,leave)*.5;const px=Math.cos(ta)*9,pz=Math.sin(ta)*9;
  if(lt<leave){ex=px;ez=pz}else{const dx=-Math.sin(ta),dz=Math.cos(ta);const k=(lt-leave)*(lt-leave)*.4+(lt-leave)*3.2;ex=px+dx*k;ez=pz+dz*k}
  earth.position.set(ex,0,ez);earth.scale.setScalar(1.3);globe.rotation.y=t*.5;orbitL.visible=true;orbitL.material.opacity=.35;
  pathL.visible=lt>leave;const ta2=a0+leave*.5;pathL.position.set(Math.cos(ta2)*9-Math.sin(ta2)*15,0,Math.sin(ta2)*9+Math.cos(ta2)*15);pathL.rotation.y=-Math.atan2(Math.cos(ta2),-Math.sin(ta2));
  cam.position.set(2,22,18);cam.lookAt(earth.position.x*.4,0,earth.position.z*.4);
  h+=cap(lt,.05,280,100,'A TERRA')+cap(lt,.35,390,150,'<span class="r">SAI VOANDO</span>');
  h+=cap(lt,1.6,1420,66,'SEM A GRAVIDADE DO SOL,<br>EM <span class="y">LINHA RETA</span> PRO ESPAÇO');
 }
 if(s.k=='moon'){sunOn(0);sunB.visible=false;sunLight.intensity=0;earth.position.set(0,-1.5,0);earth.scale.setScalar(2.4);globe.rotation.y=t*.3;
  moon.visible=true;moon.position.set(1.7,3.1,2);const k=clamp((lt-.9)/1.2);
  moon.material.emissive=new THREE.Color(0xbbbbbb);moon.material.emissiveIntensity=1-k;
  rimLight.intensity=.5;amb.intensity=.06;cam.position.set(0,1,12);cam.lookAt(0,0,0);
  h+=cap(lt,.05,280,110,'A LUA')+cap(lt,.35,400,160,'<span class="c">SOME</span>')+cap(lt,.6,570,110,'DO CÉU');
  h+=cap(lt,1.6,1420,66,'ELA SÓ BRILHA PORQUE<br><span class="y">REFLETE O SOL</span>');
 }
 if(s.k=='cold'){sunOn(0);sunB.visible=false;earth.position.set(0,-1,0);earth.scale.setScalar(2.3);globe.rotation.y=t*.3;
  rimLight.intensity=.9;amb.intensity=.15;const k=ease((lt-.3)/3.5);ice.material.opacity=k;cam.position.set(0,0,14-lt*.4);cam.lookAt(0,-.5,0);
  const temp=Math.round(15-88*k);
  h+=cap(lt,.05,250,74,'TEMPERATURA MÉDIA')+`<div class="timer" style="top:350px;color:${temp>0?'#ffe600':'#4df3ff'}">${temp}°C</div>`;
  h+=cap(lt,1.2,1380,64,'EM 1 SEMANA: <span class="c">ABAIXO DE 0°C</span>')+cap(lt,2.6,1480,64,'EM 1 ANO: <span class="c">-73°C</span>');
  shake=k>.95?0:2;
 }
 if(s.k=='plants'){const k=ease((lt-.6)/2.6);amb.intensity=1-.45*k;amb.color=new THREE.Color(0xb0c0e8);sunLight.intensity=0;rimLight.intensity=1.6-.9*k;
  groundMat.color=lerpC(0x3c7d3a,0x6b5a3a,k);
  trees.forEach(tr=>{const u=tr.userData;const kk=clamp(k*1.3-u.ph*.3);u.lv.material.color=lerpC(0x16a34a,0x7c5a2a,kk);u.lv.scale.setScalar(1-kk*.5);u.lv.position.y=3.3-kk*.8;tr.rotation.z=kk*.25*(u.ph-.5)});
  flowers.forEach((f,i)=>{f.rotation.x=k*1.2;f.userData.hd.material.color=lerpC([0xfacc15,0xf472b6,0xf97316][i%3],0x5b4632,k)});
  cam.position.set(0,4,18);cam.lookAt(0,2,-4);
  const pos=flakes.geometry.attributes.position,bs=flakes.userData.base;for(let i=0;i<pos.count;i++){pos.setY(i,(bs[i*3+1]-lt*3+60)%30);pos.setX(i,bs[i*3]+Math.sin(lt+i)*.3)}pos.needsUpdate=true;flakes.material.opacity=k;flakes.material.transparent=true;
  h+=cap(lt,.05,280,110,'AS PLANTAS')+cap(lt,.35,400,160,'<span class="r">MORREM</span>');
  h+=cap(lt,1.6,1420,66,'SEM LUZ, NÃO EXISTE<br><span class="g">FOTOSSÍNTESE</span>');
 }
 if(s.k=='isl'){amb.intensity=.25;amb.color=new THREE.Color(0x8fa6d8);sunLight.intensity=0;rimLight.intensity=.25;
  lava.material.color.setHSL(.05,1,.5+Math.sin(t*6)*.05);lavaL.intensity=4+Math.sin(t*5)*.8;
  steam.forEach(m=>{const u=m.userData;const y=((lt*2+u.o)%6);m.position.set(u.x+y*.4,7.5+y*1.6,u.z);m.scale.setScalar(1+y*.4);m.material.opacity=.35*(1-y/6)});
  cam.position.set(0,5,18-lt*.6);cam.lookAt(-1,4,-12);flakes.material.opacity=1;
  const pos=flakes.geometry.attributes.position,bs=flakes.userData.base;for(let i=0;i<pos.count;i++){pos.setY(i,(bs[i*3+1]-lt*3+60)%30)}pos.needsUpdate=true;
  h+=cap(lt,.05,260,88,'MAS DÁ PRA')+cap(lt,.35,360,130,'<span class="y">SOBREVIVER</span>')+cap(lt,.75,500,88,'PERTO DE VULCÕES');
  h+=cap(lt,1.8,1400,66,'O CALOR DE DENTRO DA TERRA<br>JÁ AQUECE CASAS NA <span class="c">ISLÂNDIA</span>');
 }
 if(s.k=='end'){const re=2.6;sunOn(lt<re?0:ease((lt-re)/.4));const a=.7+lt*.25;earth.position.set(Math.cos(a)*9,0,Math.sin(a)*9);earth.scale.setScalar(1.3);globe.rotation.y=t*.5;orbitL.visible=true;
  cam.position.set(0,9,26);cam.lookAt(0,-1.5,0);if(lt>re)shake=Math.exp(-(lt-re)*4)*20;
  h+=cap(lt,.05,260,80,'CALMA: O SOL TEM')+cap(lt,.35,360,80,'COMBUSTÍVEL PRA')+cap(lt,.65,460,140,'<span class="y">5 BILHÕES</span>')+cap(lt,.9,610,80,'DE ANOS');
  h+=cap(lt,2.8,1360,66,'COMENTA: ONDE VOCÊ')+cap(lt,3.05,1440,90,'<span class="c">SE ESCONDERIA?</span>');
 }
 const punch=1+Math.exp(-lt*10)*.12;cam.fov=50/punch;
 if(shake){cam.position.x+=Math.sin(t*93)*shake*.01;cam.position.y+=Math.cos(t*71)*shake*.01}
 cam.updateProjectionMatrix();renderer.render(scene,cam);
 h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${Math.exp(-lt*14)*.6}"></div>`;
 h+=`<div class="bar" style="width:${t/TOTAL*100}%"></div>`;
 ui.innerHTML=h;ui.style.transform=shake?`translate(${Math.sin(t*97)*shake*.25}px,${Math.cos(t*83)*shake*.25}px)`:'';
}
window.renderAt=renderAt;
</script></body></html>
