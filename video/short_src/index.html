<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display","Inter",sans-serif}
canvas{position:absolute;inset:0}
#ui{position:absolute;inset:0;color:#fff;pointer-events:none}
.cap{position:absolute;left:60px;right:60px;text-align:center;font-weight:900;text-transform:uppercase;line-height:.98;
 -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.55);letter-spacing:-1px}
.y{color:#ffe600}.r{color:#ff2d3d}.c{color:#4df3ff}
.bar{position:absolute;left:0;top:0;height:12px;background:#ffe600}
</style></head><body>
<script src="node_modules/three/build/three.min.js"></script>
<div id="ui"></div>
<script>
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,W/H,.1,500);
const amb=new THREE.AmbientLight(0xffffff,.25);scene.add(amb);
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(10,4,8);scene.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o));
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

// ---- textura procedural da Terra ----
const P=[];for(let i=0;i<512;i++)P.push(Math.floor(rnd()*256));
const hash=(x,y)=>P[(P[x&255]+y)&255]/255;
const sm=t=>t*t*(3-2*t);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
 return a+(b-a)*sm(xf)+(c-a)*sm(yf)+(a-b-c+d)*sm(xf)*sm(yf)}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vn(x*f,y*f);a*=.5;f*=2}return s}
function earthTex(mode){const cv=document.createElement('canvas');cv.width=1024;cv.height=512;const ctx=cv.getContext('2d');
 const img=ctx.createImageData(1024,512);
 for(let y=0;y<512;y++)for(let x=0;x<1024;x++){
  const lat=(y/512-.5)*Math.PI;const u=x/1024*8;
  // ruído periódico em x
  const n=fbm(u,y/512*4)*(1-x/1024)+fbm(u-8,y/512*4)*(x/1024);
  let land,ice=Math.abs(lat)>1.25;
  if(mode==0)land=n>.52;else land=Math.abs(lat)<.75+ (n-.5)*.8;
  let r,g,b;
  if(mode==1&&Math.abs(lat)>.75+(n-.5)*.8){const d=.5+n*.4;r=10*d;g=70*d;b=190*d;}
  else if(ice&&mode==0){r=g=b=235}
  else if(land){const d=.7+n*.5;const dry=fbm(u*2,y/64)>.55;r=(dry?150:50)*d;g=(dry?120:120)*d;b=(dry?60:40)*d}
  else{const d=.55+n*.5;r=8*d;g=60*d;b=160*d}
  const i=(y*1024+x)*4;img.data[i]=r;img.data[i+1]=g;img.data[i+2]=b;img.data[i+3]=255}
 ctx.putImageData(img,0,0);const t=new THREE.CanvasTexture(cv);return t}
const tex0=earthTex(0),tex1=earthTex(1);

// estrelas
{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<2500;i++){const v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(150+rnd()*100);p.push(v.x,v.y,v.z)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.6})))}

// Terra
const earth=new THREE.Group();scene.add(earth);
const earthMat=new THREE.MeshStandardMaterial({map:tex0,roughness:.85});
const globe=new THREE.Mesh(new THREE.SphereGeometry(5,96,64),earthMat);earth.add(globe);
const atm=new THREE.Mesh(new THREE.SphereGeometry(5.25,64,48),new THREE.MeshBasicMaterial({color:0x5fb8ff,transparent:true,opacity:.18,side:THREE.BackSide}));earth.add(atm);
const ring=new THREE.Mesh(new THREE.TorusGeometry(5.6,.07,8,128),new THREE.MeshBasicMaterial({color:0xffe600}));ring.rotation.x=Math.PI/2;earth.add(ring);
const pin=new THREE.Group();{const h=new THREE.Mesh(new THREE.ConeGeometry(.35,1.1,20),new THREE.MeshBasicMaterial({color:0xff2d3d}));h.rotation.x=Math.PI;h.position.y=.55;
 const s=new THREE.Mesh(new THREE.SphereGeometry(.45,20,16),new THREE.MeshBasicMaterial({color:0xff2d3d}));s.position.y=1.3;pin.add(h,s)}
earth.add(pin);
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(3,32,24),new THREE.MeshBasicMaterial({color:0xffd34d}));sunBall.position.set(28,6,-20);scene.add(sunBall);
const sunGlow=new THREE.Mesh(new THREE.SphereGeometry(5,32,24),new THREE.MeshBasicMaterial({color:0xffa500,transparent:true,opacity:.25}));sunBall.add(sunGlow);

// Cena de chão (cidade)
const city=new THREE.Group();scene.add(city);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M(0x3c7d3a,{roughness:1}));ground.rotation.x=-Math.PI/2;city.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(400,6),M(0x2b2b2b));road.rotation.x=-Math.PI/2;road.position.y=.02;city.add(road);
const flyers=[];
const colors=[0xff2d3d,0xffe600,0x4df3ff,0xffffff,0xff8a00,0x7c3aed,0x22c55e];
for(let i=0;i<70;i++){let o;const k=i%4;
 if(k==0){o=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(3,1.1,1.6),M(colors[i%7],{metalness:.4,roughness:.3}));b.position.y=.8;
  const t=new THREE.Mesh(new THREE.BoxGeometry(1.6,.8,1.4),M(0x9ad7ff,{metalness:.6}));t.position.set(-.2,1.7,0);o.add(b,t)}
 else if(k==1){o=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.35,1,6,12),M(colors[(i+2)%7]));b.position.y=.9;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),M(0xf1c27d));h.position.y=1.9;o.add(b,h)}
 else if(k==2){o=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(3,3,3),M(0xf3e6c8));b.position.y=1.5;
  const r=new THREE.Mesh(new THREE.ConeGeometry(2.6,1.8,4),M(0xb5452a));r.position.y=3.9;r.rotation.y=Math.PI/4;o.add(b,r)}
 else{o=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.2,.25,2),M(0x5b3a1a));tr.position.y=1;
  const l=new THREE.Mesh(new THREE.IcosahedronGeometry(1.3,0),M(0x16a34a,{flatShading:true}));l.position.y=2.6;o.add(tr,l)}
 o.userData={x:(rnd()-.5)*60,z:-4-rnd()*40,delay:rnd()*1.2,spd:.6+rnd()*.8,spin:rnd()*4-2,up:rnd()*2.5};
 if(k==1)o.userData.z=-2-rnd()*14;
 city.add(o);flyers.push(o)}
// partículas de vento
const wind=[];{for(let i=0;i<220;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(6+rnd()*10,.06,.06),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));
 m.userData={y:rnd()*25,z:-rnd()*60+5,o:rnd()*200,s:1+rnd()};city.add(m);wind.push(m)}}
const trees2=[];for(let i=0;i<16;i++){const t=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,4),M(0x5b3a1a));tr.position.y=2;
 const l=new THREE.Mesh(new THREE.IcosahedronGeometry(1.8,0),M(0x16a34a,{flatShading:true}));l.position.y=4.6;t.add(tr,l);t.position.set(-24+i*3.2,0,-8-(i%3)*5);city.add(t);trees2.push(t)}
// tsunami
const waveGeo=new THREE.PlaneGeometry(200,44,200,40);
const wave=new THREE.Mesh(waveGeo,new THREE.MeshStandardMaterial({color:0x0e6bd8,roughness:.25,metalness:.2,flatShading:true,side:THREE.DoubleSide}));
wave.rotation.x=-Math.PI/2;city.add(wave);
const blocks=[];for(let i=0;i<40;i++){const h=2+rnd()*12;const b=new THREE.Mesh(new THREE.BoxGeometry(2.5,h,2.5),M([0xd9d9d9,0xb0b8c4,0x8892a0][i%3]));
 b.position.set(-30+(i%10)*6.5+rnd()*2,h/2,-10-Math.floor(i/10)*6);b.userData.h=h;city.add(b);blocks.push(b)}

// ---------------- roteiro ----------------
const S=[
 {k:'hook',d:3.6},{k:'speed',d:4.4},{k:'fly',d:4.6},{k:'wind',d:4.2},{k:'tsu',d:4.2},
 {k:'day',d:4.8},{k:'cont',d:4.6},{k:'pole',d:3.4},{k:'end',d:4.2}];
let acc=0;for(const s of S){s.t0=acc;acc+=s.d}window.TOTAL=acc;window.CUTS=S.map(s=>s.t0);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ui=document.getElementById('ui');
// legenda com "pop" palavra por palavra
function cap(lt,at,top,size,html){const k=back((lt-at)/.22);if(lt<at)return'';
 return `<div class="cap" style="top:${top}px;font-size:${size}px;transform:scale(${k});opacity:${clamp((lt-at)/.08)}">${html}</div>`}
function setPin(lat,lon){const p=lat*Math.PI/180,l=lon*Math.PI/180;const v=new THREE.Vector3(Math.cos(p)*Math.cos(l),Math.sin(p),-Math.cos(p)*Math.sin(l));
 pin.position.copy(v.multiplyScalar(5));pin.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize())}

function renderAt(t){
 const s=S.find(s=>t>=s.t0&&t<s.t0+s.d)||S[S.length-1];const lt=t-s.t0,d=s.d;
 const space=['hook','speed','day','cont','pole','end'].includes(s.k);
 earth.visible=space;city.visible=!space;sunBall.visible=space;
 ring.visible=s.k=='speed';pin.visible=s.k=='speed'||s.k=='pole';
 earthMat.map=s.k=='cont'?tex1:tex0;earthMat.needsUpdate=true;
 scene.background=new THREE.Color(space?0x000008:0x87c6ff);scene.fog=space?null:new THREE.Fog(0x87c6ff,40,140);
 amb.intensity=space?.12:.7;sun.position.set(space?20:10,space?3:20,space?-6:10);
 wave.visible=s.k=='tsu';blocks.forEach(b=>b.visible=s.k=='tsu');flyers.forEach(f=>f.visible=s.k=='fly');
 wind.forEach(w=>w.visible=s.k=='wind'||s.k=='fly');trees2.forEach(x=>x.visible=s.k=='wind');
 let shake=0,h='';
 if(s.k=='hook'){ // Terra girando rápido, depois PARA
  const stop=2.2;const rot=lt<stop?lt*3:stop*3+ (1-Math.exp(-(lt-stop)*25))*.12;
  earth.rotation.set(.4,rot,0);cam.position.set(0,0,32-ease(lt/stop)*5);sun.position.set(12,5,14);cam.lookAt(0,0,0);
  if(lt>stop)shake=Math.exp(-(lt-stop)*5)*30;
  h+=cap(lt,.05,330,120,'E SE A TERRA')+cap(lt,.45,480,190,'<span class="r">PARASSE</span>')+cap(lt,.85,690,120,'DE GIRAR?');
  if(lt>stop)h+=cap(lt,stop+.15,1450,64,'<span class="y">...POR 1 SEGUNDO</span>');
 }
 if(s.k=='speed'){earth.rotation.set(.15,lt*.9,0);setPin(0,-50);ring.rotation.z=lt*2;
  cam.position.set(0,1.5,28-lt*.8);sun.position.set(12,5,14);cam.lookAt(0,0,0);
  const v=Math.round(1670*ease((lt-.5)/2));
  h+=cap(lt,.1,300,72,'NO EQUADOR VOCÊ<br>GIRA A')+cap(lt,.5,470,210,`<span class="y">${v.toLocaleString('pt-BR')}</span>`)+cap(lt,.5,690,110,'KM/H')+
   cap(lt,2.6,1430,70,'MAIS RÁPIDO QUE<br><span class="c">UM AVIÃO A JATO</span>');
 }
 if(s.k=='fly'){const go=1.0;cam.position.set(0,4+lt*.5,22);cam.lookAt(0,4,-10);
  flyers.forEach(f=>{const u=f.userData;const tt=Math.max(0,lt-go-u.delay*.4);const vx=tt*tt*40*u.spd;
   f.position.set(u.x-vx,tt*u.up*3+(tt>0?Math.sin(tt*6)*.3:0),u.z);f.rotation.set(tt*u.spin,0,tt*u.spin*1.5)});
  wind.forEach(w=>{const u=w.userData;w.material.opacity=lt>go?.7:0;w.position.set(60-((lt*140*u.s+u.o)%200),u.y,u.z)});
  if(lt>go)shake=8+Math.exp(-(lt-go)*4)*25;
  h+=cap(lt,.05,330,130,'ELA PARA...')+cap(lt,go,500,170,'<span class="r">VOCÊ NÃO!</span>')+cap(lt,2.2,1430,66,'TUDO QUE NÃO ESTÁ PRESO<br>É <span class="y">ARREMESSADO</span>');
 }
 if(s.k=='wind'){cam.position.set(4,5,24);cam.lookAt(0,5,-8);
  wind.forEach(w=>{const u=w.userData;w.material.opacity=.75;w.position.set(60-((lt*180*u.s+u.o)%200),u.y,u.z)});
  trees2.forEach((x,i)=>{x.rotation.z=.5+Math.sin(lt*14+i)*.12;x.position.x=-24+i*3.2-Math.max(0,lt-2.4)**2*25*(1+(i%3))});
  shake=10;
  h+=cap(lt,.05,300,110,'VENTOS DE')+cap(lt,.4,430,200,'<span class="c">1.600</span>')+cap(lt,.4,640,110,'KM/H')+
   cap(lt,1.8,1400,72,'<span class="y">4X</span> MAIS FORTE QUE O<br>PIOR FURACÃO JÁ MEDIDO');
 }
 if(s.k=='tsu'){cam.position.set(0,18,42);cam.lookAt(0,4,-15);
  const front=45-ease((lt-.3)/3.6)*90;const pos=waveGeo.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);const dx=x-front;
   let z=Math.sin(x*.3+lt*3)*.4+Math.cos(y*.25+lt*2)*.4;
   if(dx>-6)z+=dx<0?10*Math.exp(-dx*dx/14):10*Math.exp(-dx/30)*.85+1.5;
   pos.setZ(i,z-1.2)}pos.needsUpdate=true;waveGeo.computeVertexNormals();wave.position.set(0,0,-24);
  blocks.forEach(b=>{const hit=front<b.position.x+3;b.scale.y=hit?Math.max(.05,1-(b.position.x+3-front)*.06):1;b.position.y=b.userData.h*b.scale.y/2;b.rotation.z=hit?.3:0});
  shake=6+lt*3;
  h+=cap(lt,.05,300,120,'OS OCEANOS')+cap(lt,.4,450,150,'<span class="c">INVADEM</span>')+cap(lt,.8,610,120,'OS CONTINENTES')+
   cap(lt,2,1430,70,'<span class="y">TSUNAMIS GIGANTES</span><br>NO MUNDO TODO');
 }
 if(s.k=='day'){earth.rotation.set(.3,1.2,0);cam.position.set(-8,2,26);cam.lookAt(4,0,0);sun.position.set(28,6,-20);
  const ph=clamp((lt-2)/2.4);
  h+=cap(lt,.05,280,96,'E SE ELA')+cap(lt,.35,395,96,'<span class="r">NUNCA MAIS</span>')+cap(lt,.7,510,96,'VOLTAR A GIRAR?')+
   cap(lt,1.6,1340,140,'1 DIA = <span class="y">1 ANO</span>')+cap(lt,2.6,1530,60,'<span class="y">6 MESES DE SOL</span><br><span class="c">6 MESES DE NOITE</span>');
 }
 if(s.k=='cont'){earth.rotation.set(.2,lt*.35,0);cam.position.set(0,0,27);cam.lookAt(0,0,0);sun.position.set(12,5,14);
  h+=cap(lt,.05,290,92,'A ÁGUA FUGIRIA')+cap(lt,.4,400,92,'PARA OS <span class="c">POLOS</span>')+
   cap(lt,1.6,1340,80,'E NASCERIA UM')+cap(lt,1.9,1440,108,'<span class="y">SUPER-<br>CONTINENTE</span>');
 }
 if(s.k=='pole'){earth.rotation.set(.9,lt*.25,0);setPin(90,0);cam.position.set(0,2,27-lt*1.2);cam.lookAt(0,1.5,0);sun.position.set(12,5,14);
  h+=cap(lt,.05,300,76,'LUGAR MAIS SEGURO?')+cap(lt,.6,420,170,'<span class="y">OS POLOS</span>')+cap(lt,1.6,1430,66,'LÁ QUASE NÃO<br>EXISTE ROTAÇÃO');
 }
 if(s.k=='end'){const k=ease(lt/d);earth.rotation.set(.4,lt*k*2.5,0);cam.position.set(0,0,32-k*5);cam.lookAt(0,0,0);sun.position.set(12,5,14);
  h+=cap(lt,.05,330,84,'CALMA:')+cap(lt,.4,440,84,'ISSO É PRATICAMENTE')+cap(lt,.75,550,130,'<span class="c">IMPOSSÍVEL</span>')+
   cap(lt,1.8,1380,72,'SEGUE PRA MAIS')+cap(lt,2.1,1475,120,'<span class="y">"E SE..."</span>');
 }
 // shake + zoom punch nos cortes
 const punch=1+Math.exp(-lt*10)*.12;cam.fov=50/punch;
 if(shake){cam.position.x+=Math.sin(t*93)*shake*.01;cam.position.y+=Math.cos(t*71)*shake*.01}
 cam.updateProjectionMatrix();
 renderer.render(scene,cam);
 const flash=Math.exp(-lt*14);
 h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${flash*.6}"></div>`;
 h+=`<div class="bar" style="width:${t/TOTAL*100}%"></div>`;
 h+=`<div style="position:absolute;inset:0;transform:translate(${shake?Math.sin(t*97)*shake*.4:0}px,0)"></div>`;
 ui.innerHTML=h;
 ui.style.transform=shake?`translate(${Math.sin(t*97)*shake*.25}px,${Math.cos(t*83)*shake*.25}px)`:'';
}
window.renderAt=renderAt;
</script></body></html>
