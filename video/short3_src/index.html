<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display","Inter",sans-serif}
canvas{position:absolute;inset:0}
#ui{position:absolute;inset:0;color:#fff;pointer-events:none}
.cap{position:absolute;left:60px;right:60px;text-align:center;font-weight:900;text-transform:uppercase;line-height:.98;
 -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.55);letter-spacing:-1px}
.y{color:#ffe600}.r{color:#ff2d3d}.c{color:#4df3ff}.o{color:#ff8a00}
.bar{position:absolute;left:0;top:0;height:12px;background:#ffe600}
</style></head><body>
<script src="node_modules/three/build/three.min.js"></script>
<div id="ui"></div>
<script>
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.localClippingEnabled=true;
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000008);
const cam=new THREE.PerspectiveCamera(50,W/H,.05,600);
scene.add(new THREE.AmbientLight(0xffffff,.35));
const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(-8,6,14);scene.add(sun);
let seed=31;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=[];for(let i=0;i<512;i++)P.push(Math.floor(rnd()*256));
const hash=(x,y)=>P[(P[x&255]+y)&255]/255;const sm=t=>t*t*(3-2*t);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
 return a+(b-a)*sm(xf)+(c-a)*sm(yf)+(a-b-c+d)*sm(xf)*sm(yf)}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vn(x*f,y*f);a*=.5;f*=2}return s}
function tex(fn,w=1024,h=512){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');const img=ctx.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w*8;const n=fbm(u,y/h*4)*(1-x/w)+fbm(u-8,y/h*4)*(x/w);
  const c=fn(n,(y/h-.5)*Math.PI,x,y,u);const i=(y*w+x)*4;img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255}
 ctx.putImageData(img,0,0);return new THREE.CanvasTexture(cv)}
const earthTex=tex((n,lat,x,y,u)=>{if(Math.abs(lat)>1.25)return[235,235,235];if(n>.52){const d=.7+n*.5,dry=fbm(u*2,y/64)>.55;return[(dry?150:50)*d,120*d,(dry?60:40)*d]}const d=.55+n*.5;return[8*d,60*d,160*d]});
// textura de lava para os discos
const lavaTex=tex((n,lat,x,y,u)=>{const v=fbm(x/40,y/40);return[255*(.6+.4*v),255*(.25+.5*v*v),40*v]},512,512);

// estrelas
{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<3000;i++){const v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(200+rnd()*150);p.push(v.x,v.y,v.z)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.8})))}

// Terra em corte
const clip=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
const earth=new THREE.Group();scene.add(earth);
const globe=new THREE.Mesh(new THREE.SphereGeometry(5,96,64),new THREE.MeshStandardMaterial({map:earthTex,roughness:.85,clippingPlanes:[clip],side:THREE.DoubleSide}));
earth.add(globe);
const layers=[[5,0x7a5230,'crosta'],[4.85,0xc2410c],[3.9,0xea580c],[2.73,0xf59e0b],[0.96,0xfff1a8]];
const discs=layers.map(([r,c],i)=>{const m=new THREE.Mesh(new THREE.CircleGeometry(r,96),new THREE.MeshStandardMaterial({color:c,map:i>0?lavaTex:null,emissive:c,emissiveIntensity:i==0?0:.25+i*.12,roughness:.9}));
 m.position.z=.001*(i+1);scene.add(m);return m});
const coreGlow=new THREE.Mesh(new THREE.SphereGeometry(1.4,32,24),new THREE.MeshBasicMaterial({color:0xfff3b0,transparent:true,opacity:.25,blending:THREE.AdditiveBlending}));scene.add(coreGlow);
const coreLight=new THREE.PointLight(0xffa040,2,12);coreLight.position.set(0,0,2);scene.add(coreLight);
const tunnel=new THREE.Mesh(new THREE.PlaneGeometry(.28,10.3),new THREE.MeshBasicMaterial({color:0x0a0a0a}));tunnel.position.z=.02;scene.add(tunnel);
const tunEdge=[-1,1].map(s=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(.04,10.3),new THREE.MeshBasicMaterial({color:0xd1d5db}));m.position.set(s*.16,0,.021);scene.add(m);return m});

// pessoa
const guy=new THREE.Group();scene.add(guy);
const Mt=c=>new THREE.MeshStandardMaterial({color:c,roughness:.5});
{const b=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.3,6,12),Mt(0xff2d3d));const h=new THREE.Mesh(new THREE.SphereGeometry(.11,16,12),Mt(0xf1c27d));h.position.y=.32;
 const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.04,.22,4,8),Mt(0xff2d3d));armL.position.set(-.17,.12,0);armL.rotation.z=2.4;
 const armR=armL.clone();armR.position.x=.17;armR.rotation.z=-2.4;
 const legL=new THREE.Mesh(new THREE.CapsuleGeometry(.05,.24,4,8),Mt(0x1e3a8a));legL.position.set(-.07,-.3,0);const legR=legL.clone();legR.position.x=.07;
 guy.add(b,h,armL,armR,legL,legR);guy.userData={armL,armR,legL,legR}}
guy.position.z=.35;
// rastro
const trail=[];for(let i=0;i<24;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),new THREE.MeshBasicMaterial({color:0x4df3ff,transparent:true,opacity:0}));m.position.z=.3;scene.add(m);trail.push(m)}

// rótulos de camada (HTML posicionado via projeção)
function proj(v){const p=v.clone().project(cam);return{x:(p.x+1)/2*W,y:(1-p.y)/2*H}}

// ---------------- roteiro ----------------
const S=[{k:'hook',d:4},{k:'time',d:4.6},{k:'speed',d:4.4},{k:'heat',d:4.4},{k:'float',d:4},{k:'out',d:4.6},{k:'yoyo',d:4.4},{k:'end',d:4.6}];
let acc=0;for(const s of S){s.t0=acc;acc+=s.d}window.TOTAL=acc;window.CUTS=S.map(s=>s.t0);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ui=document.getElementById('ui');
function cap(lt,at,top,size,html){if(lt<at)return'';const k=back((lt-at)/.22);
 return `<div class="cap" style="top:${top}px;font-size:${size}px;transform:scale(${k});opacity:${clamp((lt-at)/.08)}">${html}</div>`}
const R=5.2;let hist=[];
function setGuy(y,t,flip=false,flail=1){guy.position.y=y;guy.rotation.z=flip?Math.PI:0;const u=guy.userData;
 u.armL.rotation.z=2.4+Math.sin(t*18)*.5*flail;u.armR.rotation.z=-2.4-Math.sin(t*18)*.5*flail;u.legL.rotation.x=Math.sin(t*14)*.6*flail;u.legR.rotation.x=-Math.sin(t*14)*.6*flail}

function renderAt(t){
 const s=S.find(s=>t>=s.t0&&t<s.t0+s.d)||S[S.length-1];const lt=t-s.t0,d=s.d;
 globe.rotation.y=t*.15;earth.rotation.x=0;
 let shake=0,h='',gy=R,showTrail=false,labels=false,flip=false,flail=1;
 coreGlow.scale.setScalar(1+Math.sin(t*5)*.06);
 if(s.k=='hook'){const jump=2.4;
  gy=lt<jump?R+.25+Math.abs(Math.sin(lt*5))*.15:R+.25+.6*(lt-jump)-3*(lt-jump)**2*2.2;
  const z=1-ease(lt/3.5);cam.position.set(0,R*.55*(1-z)+R*z*.9,7+z*0+ (1-z)*21);cam.lookAt(0,R*(z*.95)+(1-z)*1,0);
  if(lt>jump)shake=Math.exp(-(lt-jump)*5)*18;flail=lt>jump?1.6:.2;
  h+=cap(lt,.05,300,80,'E SE VOCÊ PULASSE')+cap(lt,.45,400,92,'NUM BURACO QUE')+cap(lt,.85,540,150,'<span class="r">ATRAVESSA</span>')+cap(lt,1.2,700,120,'A TERRA?');
 }
 if(s.k=='time'){const f=ease(lt/d*.9);gy=R-f*3.2;cam.position.set(0,0,28);cam.lookAt(0,0,0);showTrail=true;labels=lt>2.4;
  const min=Math.round(42*clamp((lt-.4)/2));
  h+=cap(lt,.05,290,92,'A QUEDA DURARIA')+cap(lt,.4,400,220,`<span class="y">${min}</span>`)+cap(lt,.4,630,110,'MINUTOS');
  h+=cap(lt,2.6,1500,62,'12.742 KM DE<br>UM LADO AO OUTRO');
 }
 if(s.k=='speed'){const f=lt/d;gy=R-3.2-f*2.1;cam.position.set(1.2,gy+.3,4.2);cam.lookAt(0,gy-.4,0);showTrail=true;shake=6+f*12;flail=2;
  const v=Math.round(28000*ease((lt-.3)/2)/100)*100;
  h+=cap(lt,.05,290,84,'PERTO DO CENTRO')+cap(lt,.4,400,200,`<span class="c">${v.toLocaleString('pt-BR')}</span>`)+cap(lt,.4,610,110,'KM/H');
  h+=cap(lt,2.2,1430,66,'MAIS RÁPIDO QUE<br>A <span class="y">ESTAÇÃO ESPACIAL</span>');
 }
 if(s.k=='heat'){gy=.9-lt*.2;const z=ease(lt/2);cam.position.set(0,.6-z*.4,9-z*4.5);cam.lookAt(0,0,0);shake=5;coreGlow.scale.setScalar(1.3+Math.sin(t*9)*.1);
  h+=cap(lt,.05,300,110,'O NÚCLEO TEM')+cap(lt,.4,430,190,'<span class="o">5.000°C</span>');
  h+=cap(lt,1.8,1380,72,'QUENTE COMO A<br>SUPERFÍCIE DO <span class="y">SOL</span>')+cap(lt,2.8,1560,46,'(OBVIAMENTE VOCÊ PRECISARIA DE UM TRAJE MUITO BOM)');
 }
 if(s.k=='float'){gy=Math.sin(lt*1.5)*.08;cam.position.set(Math.sin(lt*.5)*1.2,.2,3.2);cam.lookAt(0,0,0);flail=.15;
  guy.rotation.set(0,0,lt*.8);
  h+=cap(lt,.05,300,110,'NO CENTRO')+cap(lt,.4,420,110,'VOCÊ')+cap(lt,.7,540,170,'<span class="c">FLUTUARIA</span>');
  h+=cap(lt,1.8,1400,70,'GRAVIDADE <span class="y">ZERO</span>:<br>A TERRA TE PUXA<br>PRA TODO LADO IGUAL');
 }
 if(s.k=='out'){const f=eio(lt/3);gy=-f*(R+.25);flip=true;cam.position.set(0,-2.5-f*1.5,22-f*8);cam.lookAt(0,-2-f*2.5,0);showTrail=lt<3;
  if(lt>3){flail=.3}
  h+=cap(lt,.05,280,92,'E SAINDO DO BRASIL')+cap(lt,.4,390,92,'VOCÊ APARECERIA')+cap(lt,.75,500,170,'<span class="y">NO JAPÃO?</span>');
  h+=cap(lt,2.2,1400,66,'QUASE! O OUTRO LADO<br>DO BRASIL É O <span class="c">OCEANO<br>PACÍFICO</span>, PERTO DE LÁ');
 }
 if(s.k=='yoyo'){gy=Math.cos(lt*2.2)*(R+.1);flip=Math.sin(lt*2.2)>0;cam.position.set(0,0,26);cam.lookAt(0,0,0);showTrail=true;flail=1.5;
  h+=cap(lt,.05,290,96,'SE NINGUÉM')+cap(lt,.35,395,96,'TE SEGURAR...')+cap(lt,1,1360,90,'VOCÊ CAIRIA DE VOLTA')+cap(lt,1.5,1470,150,'<span class="r">PRA SEMPRE</span>');
 }
 if(s.k=='end'){const z=ease(lt/2.5);gy=R+.25;flail=.2;cam.position.set(0,R*.55*z+1*(1-z),26-z*19);cam.lookAt(0,1*(1-z)+R*.95*z,0);
  h+=cap(lt,.05,300,80,'CALMA: O BURACO')+cap(lt,.35,395,80,'MAIS FUNDO JÁ')+cap(lt,.65,490,80,'CAVADO TEM SÓ')+cap(lt,1,600,190,'<span class="c">12 KM</span>');
  h+=cap(lt,2.2,1400,72,'SEGUE PRA MAIS')+cap(lt,2.5,1495,120,'<span class="y">"E SE..."</span>');
 }
 setGuy(gy,t,flip,flail);if(s.k!='float')guy.rotation.y=0;
 // rastro
 hist.push(gy);if(hist.length>60)hist.shift();
 trail.forEach((m,i)=>{const k=hist.length-1-i*2;if(!showTrail||k<0){m.material.opacity=0;return}m.position.y=hist[k];m.material.opacity=.6*(1-i/trail.length)});
 const punch=1+Math.exp(-lt*10)*.12;cam.fov=50/punch;
 if(shake){cam.position.x+=Math.sin(t*93)*shake*.004;cam.position.y+=Math.cos(t*71)*shake*.004}
 cam.updateProjectionMatrix();renderer.render(scene,cam);
 if(labels){const lb=[[new THREE.Vector3(3.6,-3.6,0),'CROSTA'],[new THREE.Vector3(-3.1,-2.3,0),'MANTO'],[new THREE.Vector3(1.9,-1.4,0),'NÚCLEO<br>EXTERNO'],[new THREE.Vector3(-.75,.45,0),'NÚCLEO<br>INTERNO']];
  const o=clamp((lt-2.4)/.3);
  lb.forEach(([v,n],i)=>{const p=proj(v);h+=`<div style="position:absolute;left:${p.x}px;top:${p.y}px;transform:translate(-50%,-50%) scale(${back((lt-2.4-i*.12)/.25)});font:900 38px Inter Display;line-height:1;text-align:center;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill;opacity:${o}">${n}</div>`})}
 h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${Math.exp(-lt*14)*.6}"></div>`;
 h+=`<div class="bar" style="width:${t/TOTAL*100}%"></div>`;
 ui.innerHTML=h;ui.style.transform=shake?`translate(${Math.sin(t*97)*shake*.25}px,${Math.cos(t*83)*shake*.25}px)`:'';
}
window.renderAt=renderAt;
</script></body></html>
