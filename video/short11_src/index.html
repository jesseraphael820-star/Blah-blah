<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display","Inter","Noto Color Emoji",sans-serif}
canvas#gl{position:absolute;inset:0}
#ui{position:absolute;inset:0;color:#fff;pointer-events:none;overflow:hidden}
.cap{position:absolute;left:40px;right:40px;top:1420px;text-align:center;font-weight:900;text-transform:uppercase;font-size:88px;line-height:1.02;letter-spacing:-1px;
 -webkit-text-stroke:13px #000;paint-order:stroke fill;text-shadow:0 10px 0 #000}
.cap .on{color:#ffe600}
.lbl{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
.lbl .n{font:900 64px "Inter Display";text-transform:uppercase;-webkit-text-stroke:10px #000;paint-order:stroke fill}
.lbl .s{display:inline-block;margin-top:6px;font:900 44px "Inter Display";background:#ffe600;color:#000;border:5px solid #000;border-radius:14px;padding:4px 16px}
.mult{position:absolute;left:50px;top:215px;font:900 150px "Inter Display";color:#ff2d3d;-webkit-text-stroke:12px #000;paint-order:stroke fill}
.mult small{display:block;font-size:40px;color:#fff;text-align:left;-webkit-text-stroke:7px #000}
.hud{position:absolute;left:50px;top:160px;font:800 34px "JetBrains Mono",monospace;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill}
.bar{position:absolute;left:0;top:0;height:14px;background:linear-gradient(90deg,#ff2d3d,#ffe600)}
.top{position:absolute;left:0;right:0;top:250px;text-align:center;font:900 96px "Inter Display";text-transform:uppercase;-webkit-text-stroke:13px #000;paint-order:stroke fill;line-height:1}
</style></head><body>
<script src="node_modules/three/build/three.min.js"></script>
<script src="timing.js"></script>
<div id="ui"></div>
<script>
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,logarithmicDepthBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.domElement.id='gl';
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,W/H,.0005,2000);
const amb=new THREE.AmbientLight(0xffffff,.45);scene.add(amb);
const sunL=new THREE.DirectionalLight(0xffffff,1.3);sunL.position.set(-6,4,8);scene.add(sunL);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
let seed=131;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=[];for(let i=0;i<512;i++)P.push(Math.floor(rnd()*256));
const hash=(x,y)=>P[(P[x&255]+y)&255]/255;const sm=t=>t*t*(3-2*t);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*sm(xf)+(c-a)*sm(yf)+(a-b-c+d)*sm(xf)*sm(yf)}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vn(x*f,y*f);a*=.5;f*=2}return s}
function tex(fn,w=1024,h=512){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');const img=ctx.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w*8;const n=fbm(u,y/h*4)*(1-x/w)+fbm(u-8,y/h*4)*(x/w);const c=fn(n,(y/h-.5)*Math.PI,x,y,u);const i=(y*w+x)*4;img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255}
 ctx.putImageData(img,0,0);return new THREE.CanvasTexture(cv)}
const T_earth=tex((n,lat,x,y,u)=>{if(Math.abs(lat)>1.25)return[235,235,235];if(n>.52){const d=.7+n*.5,dry=fbm(u*2,y/64)>.55;return[(dry?150:50)*d,120*d,(dry?60:40)*d]}const d=.55+n*.5;return[8*d,60*d,160*d]});
const T_moon=tex((n,lat,x,y,u)=>{const v=110+n*120+(fbm(u*3,y/40)>.6?-45:0);return[v,v,v]});
const T_jup=tex((n,lat,x,y,u)=>{const b=Math.sin(lat*14+n*3);let c=b>0?[226,196,160]:[176,120,80];const dx=(x/1024-.62)*4,dy=(lat+.35)*6;if(dx*dx+dy*dy<1)c=[200,90,60];return c.map(v=>v*(.85+n*.3))});
const T_sun=tex((n,lat,x,y,u)=>{const v=fbm(x/12,y/12);return[255,170+v*80,40+v*60]});
const T_bet=tex((n,lat,x,y,u)=>{const v=fbm(x/50,y/50);return[255,90+v*90,30+v*30]});

// estrelas fixas (fundo)
const stars=(()=>{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<4000;i++){const v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(800+rnd()*400);p.push(v.x,v.y,v.z)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const s=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.4,transparent:true,sizeAttenuation:false}));scene.add(s);return s})();
// chão
const ground=new THREE.Mesh(new THREE.CircleGeometry(1,96),M(0x4f8a3a,{roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);

// ---- objetos em tamanho unitário (altura ou diâmetro = 1) ----
function person(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.38,8,12),M(0xff2d3d));b.position.y=.42;
 const h=new THREE.Mesh(new THREE.SphereGeometry(.11,20,14),M(0xffc9a0));h.position.y=.86;const hair=new THREE.Mesh(new THREE.SphereGeometry(.115,20,14,0,Math.PI*2,0,1.3),M(0x3b2314));hair.position.y=.875;
 const l1=new THREE.Mesh(new THREE.CapsuleGeometry(.05,.22,6,8),M(0x1e3a8a));l1.position.set(-.06,.13,0);const l2=l1.clone();l2.position.x=.06;
 const a1=new THREE.Mesh(new THREE.CapsuleGeometry(.04,.26,6,8),M(0xff2d3d));a1.position.set(-.19,.48,0);a1.rotation.z=.15;const a2=a1.clone();a2.position.x=.19;a2.rotation.z=-.15;
 const e1=new THREE.Mesh(new THREE.SphereGeometry(.018,8,6),M(0x111111));e1.position.set(-.04,.88,.1);const e2=e1.clone();e2.position.x=.04;g.add(b,h,hair,l1,l2,a1,a2,e1,e2);return g}
function burj(){const g=new THREE.Group();const mat=M(0xcfd8e3,{metalness:.7,roughness:.25});let y=0;const tiers=[[.075,.18],[.06,.15],[.05,.13],[.04,.12],[.03,.1],[.022,.09],[.014,.07]];
 tiers.forEach(([r,h])=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(r*.85,r,h,6),mat);c.position.y=y+h/2;g.add(c);y+=h});
 const sp=new THREE.Mesh(new THREE.ConeGeometry(.008,1-y,8),mat);sp.position.y=y+(1-y)/2;g.add(sp);return g}
function everest(){const geo=new THREE.ConeGeometry(1.15,1,16,8);const p=geo.attributes.position;for(let i=0;i<p.count;i++){const v=new THREE.Vector3().fromBufferAttribute(p,i);if(v.y<.49){const k=1+(rnd()-.5)*.22;p.setXYZ(i,v.x*k,v.y+(rnd()-.5)*.04,v.z*k)}}
 geo.computeVertexNormals();const col=[];for(let i=0;i<p.count;i++){const y=p.getY(i);const s=y>.1?1:y>-.05?.5:0;col.push(.42+.58*s,.4+.6*s,.38+.62*s)}geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.9}));m.position.y=.5;const g=new THREE.Group();g.add(m);return g}
function planet(map,o={}){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.SphereGeometry(.5,64,48),o.emissive?new THREE.MeshBasicMaterial({map}):M(0xffffff,{map,roughness:.9}));g.add(m);g.userData.m=m;
 if(o.atm)g.add(new THREE.Mesh(new THREE.SphereGeometry(.53,48,32),new THREE.MeshBasicMaterial({color:o.atm,transparent:true,opacity:.2,side:THREE.BackSide})));
 if(o.glow)[[.62,.35],[.8,.15],[1.1,.06]].forEach(([r,op])=>g.add(new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.MeshBasicMaterial({color:o.glow,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide}))));return g}

// cadeia de objetos: tamanho real (m) e posição absoluta (m)
const OBJ=[
 {k:'voce',name:'VOCÊ',size:1.7,w:.5,ground:true,mk:person,label:'1,70 m'},
 {k:'burj',name:'BURJ KHALIFA',size:828,w:100,ground:true,mk:burj,label:'828 m',mult:'x487'},
 {k:'everest',name:'EVEREST',size:8849,w:20000,kd:2.6,ground:true,mk:everest,label:'8.849 m',mult:'x10'},
 {k:'lua',name:'LUA',size:3.474e6,mk:()=>planet(T_moon),label:'3.474 km',kd:2.3,mult:'x392'},
 {k:'terra',name:'TERRA',size:1.2742e7,mk:()=>planet(T_earth,{atm:0x5fb8ff}),label:'12.742 km',kd:2.3,mult:'x3,7'},
 {k:'jupiter',name:'JÚPITER',size:1.3982e8,mk:()=>planet(T_jup),label:'139.820 km',kd:2.3,mult:'x11'},
 {k:'sol',name:'SOL',size:1.3927e9,mk:()=>planet(T_sun,{emissive:true,glow:0xffa020}),label:'1,4 MILHÃO DE km',kd:2.6,mult:'x10'},
 {k:'betel',name:'BETELGEUSE',size:1.06e12,mk:()=>planet(T_bet,{emissive:true,glow:0xff4a10}),label:'~1 BILHÃO DE km',kd:2.6,fexp:3,mult:'x760'},
];
let x=0;OBJ.forEach((o,i)=>{const w=o.w||o.size;if(i>0){const p=OBJ[i-1];x+=(p.w||p.size)/2+w/2+(o.ground?w*.05:o.size*.06)}
 o.x=x;o.y=o.ground?0:o.size/2+(OBJ[i-1].ground?0:0);o.cy=o.ground?o.size/2:o.y;
 if(!o.ground){o.y=OBJ[i-1].ground?o.size*.5:OBJ[i-1].cy;o.cy=o.y}
 o.g=o.mk();scene.add(o.g)});
// a Lua "flutua" à direita do Everest na altura dele
OBJ[3].y=OBJ[3].cy=OBJ[3].size*.5;

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ui=document.getElementById('ui');
window.CUTS=SEG.map(s=>s.t0);
const KD=1.25; // distância de câmera (em tamanhos do objeto)
const lerp=(a,b,k)=>a+(b-a)*k;
function view(t){ // retorna {D, tx, ty, stageIndex}
 const si=SEG.findIndex(s=>t>=s.t0&&t<s.t0+s.d);const s=SEG[si<0?SEG.length-1:si];const lt=t-s.t0,d=s.d;
 const p0=OBJ[0];
 if(s.k=='hook'){const k=ease(lt/d);return{s,lt,d,D:p0.size*lerp(.32,.45,k),tx:p0.x,ty:p0.size*.86}}
 if(s.k=='voce'){const k=eio(lt/(d*.8));return{s,lt,d,D:p0.size*lerp(.45,KD,k),tx:p0.x,ty:lerp(p0.size*.86,p0.cy,k)}}
 const idx=OBJ.findIndex(o=>o.k==s.k);
 if(idx>0){const a=OBJ[idx-1],b=OBJ[idx];const k=eio((lt-.1)/(d*.68));
  const D0=a.size*(a.kd||KD),D1=b.size*(b.kd||KD);const D=Math.exp(lerp(Math.log(D0),Math.log(D1),k));const f=Math.pow(k,b.fexp||.8);
  return{s,lt,d,D,tx:lerp(a.x,b.x,f),ty:lerp(a.cy,b.cy,f),idx}}
 // end: afasta ainda mais
 const b=OBJ[OBJ.length-1];const k=eio(lt/(d*.85));const D=b.size*b.kd*Math.exp(k*Math.log(30));return{s,lt,d,D,tx:b.x,ty:b.cy}}

function renderAt(t){
 const v=view(t);const {s,lt,d,D}=v;
 // fundo: céu -> espaço
 const sp=clamp((Math.log10(D)-3.4)/1.6);scene.background=new THREE.Color(0x7cc4ff).lerp(new THREE.Color(0x000006),sp);
 stars.material.opacity=sp;ground.visible=sp<.99;
 const gs=Math.max(D*60,3e5);ground.scale.setScalar(gs/D);ground.position.set((OBJ[1].x-v.tx)/D,(-v.ty)/D-0.0001,0);ground.material.opacity=1-sp;ground.material.transparent=sp>0;
 amb.intensity=.45+sp*.05;
 const curI=s.k=='end'?OBJ.length-1:Math.max(0,OBJ.findIndex(o=>o.k==s.k));OBJ.forEach((o,i)=>{const r=o.size/D;const vis=r>.0015&&r<300&&i<=curI;o.g.visible=vis;if(!vis)return;o.g.scale.setScalar(r);o.g.position.set((o.x-v.tx)/D,(o.y-v.ty)/D,o.ground?0:-Math.max(0,r*.62-.8));
  if(o.g.userData.m)o.g.userData.m.rotation.y=t*.15});
 // o chão some no espaço: objetos de chão ganham "pedestal" invisível
 cam.position.set(0,0,1);cam.lookAt(0,0,0);
 const punch=Math.exp(-lt*9);cam.fov=50/(1+punch*.1);
 let shake=0;if(s.k=='betel'&&lt>.3&&lt<2.5)shake=6;if(s.k=='hook'&&lt<.25)shake=20;
 if(shake){cam.position.x+=Math.sin(t*93)*shake*.0008;cam.position.y+=Math.cos(t*71)*shake*.0008}
 cam.updateProjectionMatrix();renderer.render(scene,cam);
 // ---- overlay ----
 let h='';
 const proj=(x,y)=>{const p=new THREE.Vector3(x,y,0).project(cam);return{x:(p.x+1)/2*W,y:(1-p.y)/2*H}};
 const idx=OBJ.findIndex(o=>o.k==s.k);
 if(idx>=0){const o=OBJ[idx];const k=back((lt-(idx==0?.2:.9))/.25);if(k>0){const top=proj((o.x-v.tx)/D,((o.ground?o.size*1.02:o.cy+o.size*.52)-v.ty)/D);
   const y=idx==0?Math.max(330,Math.min(1250,top.y-20)):600;const xx=idx==0?Math.max(260,Math.min(820,top.x)):540;
   h+=`<div class="lbl" style="left:${xx}px;top:${y}px;transform:translate(-50%,-100%) scale(${k})"><div class="n">${idx==0?'👇 ':''}${o.name}</div><div class="s">${o.label}</div></div>`}
  if(o.mult){const mk=back((lt-.15)/.25);h+=`<div class="mult" style="transform:scale(${mk}) rotate(6deg)">${o.mult}<small>MAIOR</small></div>`}}
 if(s.k=='hook'){h+=`<div class="top" style="transform:scale(${back(lt/.2)})">VOCÊ ACHA QUE<br><span style="color:#ffe600">É GRANDE?</span></div>`}
 if(s.k=='end'&&lt>2){h+=`<div class="top" style="top:300px;font-size:84px;transform:scale(${back((lt-2)/.25)})">QUAL TE<br><span style="color:#ffe600">CHOCOU MAIS?</span> 🤯</div>`}
 // régua de escala
 const fmt=m=>m<1000?Math.round(m)+' m':m<1e6?Math.round(m/1000).toLocaleString('pt-BR')+' km':m<1e9?(m/1e6).toFixed(1).replace('.',',')+' mil km':(m/1e9).toFixed(1).replace('.',',')+' mi km';
 h+=`<div class="hud">📏 TELA: ${fmt(D*1.3)}</div>`;
 // legenda
 const ws=s.words;let ci=-1;ws.forEach((w,i)=>{if(lt>=w[1])ci=i});
 if(ci>=0){const st=Math.floor(ci/3)*3;const chunk=ws.slice(st,st+3);const e=lt-ws[st][1];
  h+=`<div class="cap" style="transform:scale(${back(e/.15)})">${chunk.map((w,i)=>st+i<=ci?`<span class="${st+i==ci?'on':''}">${w[0]}</span>`:'').join(' ')}</div>`}
 h+=`<div class="bar" style="width:${t/TOTAL*100}%"></div>`;
 const fl=Math.exp(-lt*14);if(t>.2)h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${fl*.35}"></div>`;
 ui.innerHTML=h;ui.style.transform=shake?`translate(${Math.sin(t*97)*shake*.3}px,${Math.cos(t*83)*shake*.3}px)`:'';
}
window.renderAt=renderAt;
</script></body></html>
