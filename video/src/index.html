const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const fade=(lt,a,d)=>clamp((lt-a)/.5)*clamp((d-.4-lt)/.4);

function renderAt(t){

 cam.lookAt(offX,4,0);
 g.position.x=(s.k=='intro'||s.k=='end')?0:0;g.rotation.y=Math.sin(lt*.25)*.25;
 parts.rotation.y=t*.02;parts.position.y=Math.sin(t*.3)*.5;
 const pop=ease(lt/1.2);g.scale.setScalar(.6+.4*pop);

 if(s.k=='intro'){g.rotation.y=lt*.15-.4;const pos=u.flag.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i);pos.setZ(i,Math.sin(x*2+t*4)*.15*(x+1.5))}pos.needsUpdate=true;}
 if(s.k=='seg'){u.sh.rotation.y=lt*.8;u.sh.position.y=5+Math.sin(lt*2)*.3;const on=Math.floor(lt*3)%2;u.l[0].intensity=on?4:0;u.l[1].intensity=on?0:4}
 if(s.k=='eco'){u.bars.forEach((b,i)=>{const h=1+ease((lt-.3-i*.15)/1.5)*(1.5+i*1.1);b.scale.y=h;b.position.y=h/2});
  u.coins.forEach(c=>{const d=c.userData;const y=12-((lt*3*d.s+d.o)%14);c.position.set(d.x,y,d.z);c.rotation.set(lt*2*d.s,0,lt*3*d.s+d.o)})}
 if(s.k=='just'){const tilt=Math.sin(lt*1.3)*.18*Math.exp(-lt*.1);u.beam.rotation.z=tilt;u.pans.forEach(p=>p.rotation.z=-tilt)}
 if(s.k=='agro'){u.crops.forEach((c,i)=>{const k=ease((lt-.2-(i%10)*.08)/1.2);c.scale.set(1,.05+k,1);c.position.y=.5*(.05+k)});
  u.tr.position.set(-9+((lt*1.6)%12),0,4.8);
  u.trees.forEach(tr=>{const k=clamp((lt-3-tr.userData.k*4)/.6);tr.scale.setScalar(1-k*.95);tr.rotation.z=k*1.2})}
 if(s.k=='arm'){u.tg.rotation.y=Math.sin(lt*.7)*.5;const o=ease((lt-1.5)/1);u.shk.position.y=.85+o*.6;u.shk.rotation.y=o*1.2;u.lock.rotation.y=-.4+Math.sin(lt)*.2}
 if(s.k=='ext'){u.gl.rotation.y=-1.6+lt*.18;u.gl.rotation.x=.25;u.arcs[0].scale.setScalar(1);u.arcs.forEach((a,i)=>{a.material.opacity=1})}
 if(s.k=='cos'){u.hearts.forEach(h=>{const o=h.userData.o;const y=((lt*.9+o*.8)%6);h.position.set(Math.sin(o*1.7)*4,3+y,Math.cos(o*1.7)*2);h.rotation.y=lt*2+o;h.scale.setScalar(.6*Math.sin(Math.PI*y/6))});
  u.fam.forEach((p,i)=>p.position.y=Math.abs(Math.sin(lt*3+i))*.25)}
 if(s.k=='gov'){u.seats.forEach(st=>{const k=ease((lt-.3-st.userData.f*2.5)/.4);st.scale.setScalar(.01+k);st.position.y=.35+(1-k)*3})}
 if(s.k=='end'){u.u.rotation.y=Math.sin(lt*.5)*.4;u.chk.forEach(c=>{const d=c.userData;c.position.set(Math.cos(d.a+lt*d.s)*d.r,1+((d.y+lt*.6)%8),Math.sin(d.a+lt*d.s)*d.r);c.rotation.set(lt*d.s*2,lt,0)})}
 renderer.render(scene,cam);

 // UI
 let h='';
 if(s.k=='intro'){
  h=`<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,.75),rgba(0,0,0,.2) 55%,rgba(0,0,0,0) 75%)"></div><div class="big" style="top:250px;font-size:44px;color:#ffd84a;letter-spacing:10px;${css(lt,.3,d,0)}">E SE...</div>
  <div class="big" style="top:320px;font-size:96px;${css(lt,.8,d,0)}">Flávio Bolsonaro<br>fosse presidente?</div>
  <div class="big" style="top:590px;font-size:36px;color:#cfe;${css(lt,2,d,0)}">As propostas, o que poderia mudar no Brasil<br>e o que dizem apoiadores e críticos</div>`;
 }else if(s.k=='end'){
  h=`<div class="big" style="top:180px;font-size:84px;${css(lt,.3,d,0)}">Quem decide é você.</div>
  <div class="big" style="top:330px;font-size:38px;color:#cfe;line-height:1.5;${css(lt,1.2,d,0)}">Nenhum cenário está garantido: tudo dependeria<br>do Congresso, da Justiça, da economia mundial e da sociedade.</div>
  <div class="big" style="top:860px;font-size:28px;color:#ffd84a;${css(lt,2.5,d,0)}">Pesquise as propostas oficiais e compare os candidatos.</div>`;
 }else{
  h=`<div class="tag" style="${css(lt,.2,d)}">${s.tag}</div><div class="prog" style="${css(lt,.2,d,0)}">${s.n}</div>
  <div class="title" style="${css(lt,.4,d)}">${s.title}</div>
  <div class="prop" style="${css(lt,1,d)}">${s.prop}</div>
  <div class="card pro" style="${css(lt,2.6,d)}"><b style="color:#7dffb0">✔ APOIADORES DIZEM</b>${s.pro}</div>
  <div class="card con" style="${css(lt,4,d)}"><b style="color:#ffb3a8">⚠ CRÍTICOS ALERTAM</b>${s.con}</div>`;
 }
 const gf=clamp(t/.6)*clamp((TOTAL-t)/.6);
 h+=`<div class="foot">${FOOT}</div><div style="position:absolute;inset:0;background:#000;opacity:${1-gf}"></div>`;
 // flash entre cenas
 const tr=Math.min(lt,d-lt);if(tr<.25&&t>.3&&t<TOTAL-.3)h+=`<div style="position:absolute;inset:0;background:#000;opacity:${1-tr/.25}"></div>`;
 ui.innerHTML=h;
}
window.renderAt=renderAt;
</script></body></html>
