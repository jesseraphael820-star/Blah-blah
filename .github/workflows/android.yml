name: Android APK + testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Testes do emulador x86 (Node)
        run: node tests/v86-boot.test.mjs && node tests/v86-linux.test.mjs
      - name: Teste end-to-end (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/e2e.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/screenshots

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
